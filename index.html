/* ---------- Loyihani ochish ---------- */
async function listProjects(){
  try{ const all = await dbAll("projects"); return all.sort((a,b)=>b.updatedAt-a.updatedAt); }catch(e){ return []; }
}
async function refreshRecent(){
  const list = (await listProjects()).slice(0,4);
  $("#recent").innerHTML = list.length ? `<h2>So‘nggi loyihalar</h2>` + list.map(p =>
    `<button class="rec" data-open="${esc(p.id)}"><b>${esc(p.name)}</b><span>${fmtDate(p.updatedAt)}</span></button>`).join("") : "";
}
async function openProjectList(){
  const list = await listProjects();
  const render = () => list.length ? list.map(p => `<div class="mrow"><div class="grow"><b>${esc(p.name)}</b><small>${p.polys.length} ta poligon · ${fmtDate(p.updatedAt)}</small></div>
      <button class="btn primary" data-open="${esc(p.id)}">Ochish</button><button class="btn danger" data-del="${esc(p.id)}" aria-label="O‘chirish">O‘chirish</button></div>`).join("")
    : `<p class="help" style="font-size:14px">Saqlangan loyihalar yo‘q. “+ Yangi loyiha” bilan boshlang.</p>`;
  openModal({title:"Loyihani ochish", wide:true, html:`<div id="plist">${render()}</div>`, actions:[{label:"Yopish"}], onMount(ov){
    ov.addEventListener("click", async e => {
      const b = e.target.closest("button"); if(!b) return;
      if(b.dataset.open){ try{ await loadProject(b.dataset.open); closeModal(); }catch(_){ toast("Loyihani ochib bo‘lmadi.", true); } }
      else if(b.dataset.del){
        const id = b.dataset.del;
        if(b.dataset.sure !== "1"){ b.dataset.sure = "1"; b.textContent = "Ishonchingiz komilmi?"; return; }
        try{ await dbDel("projects", id); await dbDel("images", id); }catch(_){}
        LS.del("fzm-imported-" + id);
        const i = list.findIndex(p => p.id === id); if(i >= 0) list.splice(i,1);
        $("#plist", ov).innerHTML = render(); refreshRecent();
      }
    });
  }});
}

/* ---------- Masshtab ---------- */
function askScale(){
  const [a,b] = SC.pts; const d = Math.hypot(a[0]-b[0], a[1]-b[1]);
  openModal({
    title:"Masshtabni sozlash",
    html:`<p style="margin-top:0">Belgilangan ikki nuqta orasidagi haqiqiy masofa qancha?</p>
      <label class="f">Masofa (metr)<input type="number" id="scM" min="0.01" step="any" value="${P.scale ? P.scale.meters : 100}"></label>
      <p class="help">Rasmdagi masofa: ${d.toFixed(1)} px. Masshtab faqat siz kiritgan masofaga asoslanadi — ilova uni o‘zi taxmin qilmaydi.</p>
      <p class="err" id="scErr"></p>`,
    actions:[{label:"Bekor qilish", onClick:()=>{ SC.pts = []; invalidate(); }},{label:"Saqlash", cls:"primary", keep:true, onClick:(ov)=>{
      const m = parseFloat($("#scM", ov).value);
      if(!(m > 0) || d < 1){ $("#scErr", ov).textContent = "Masofani metrda musbat son sifatida kiriting."; return false; }
      P.scale = {p1:a, p2:b, meters:m, pxPerM:d/m}; SC.pts = [];

      toast(`Masshtab o‘rnatildi: 1 px = ${(m/d).toFixed(3)} m`);
      return false;
    }}],
    onMount(){ }

}

/* ---------- Statistika ---------- */
function openStats(){
  const st = computeStats();
  const nZ = st.rows.length, nP = P.polys.length;
  const osm = P.mode === "osm";
  const hasScale = osm || !!P.scale;
  const totalM2 = hasScale ? st.rows.reduce((a,r)=>a+r.m2,0) : null;
  const cover = osm ? null : Math.min(100, st.totalPx / (P.imgW*P.imgH) * 100);
  const rows = st.rows.map(r => {
    const pct = st.totalPx ? r.px/st.totalPx*100 : 0;
    return `<div class="srow"><div class="l"><span class="sw" style="background:${esc(r.z.color)}"></span><span class="n">${esc(r.z.icon)} ${esc(r.z.name)}</span>
      <span class="v">${r.count} ta${hasScale ? " · " + fmtArea(r.m2) : ""}</span><span class="p">${pct.toFixed(0)}%</span></div>
      <div class="bar"><i style="width:${pct.toFixed(1)}%;background:${esc(r.z.color)}"></i></div></div>`;
  }).join("");
  openModal({
    title:"Statistika", wide:true,
    html:`<div class="stat-top"><div><b>${nZ}</b><span>Zonalar (poligonli)</span></div><div><b>${nP}</b><span>Poligonlar</span></div>
      <div><b>${hasScale ? fmtArea(totalM2) : "—"}</b><span>Umumiy maydon</span></div></div>
      ${nP ? rows : `<p class="help" style="font-size:14px">Hali poligon yo‘q. ${osm ? "Xarita" : "Rasm"} ustida zona chizing.</p>`}
      ${nP && cover!=null ? `<p class="help">Ulush zonalangan hududning umumiy maydoniga nisbatan hisoblanadi (zonalangan qism rasmning taxminan ${cover.toFixed(0)}% ini tashkil etadi). Bir-birining ustiga tushgan poligonlar ikki marta sanaladi.</p>` : ""}
      ${nP && osm ? `<p class="help">OSM rejimida maydon xaritaning haqiqiy koordinatalaridan avtomatik hisoblanadi — masshtab qo‘lda kiritilmaydi.</p>` : ""}
      ${hasScale || !nP ? "" : `<p class="help">Maydon hisoblash uchun avval masshtabni belgilang (yuqoridagi “Masshtab” vositasi).</p>`}`,
    actions:[{label:"Yopish", cls:"primary"}]
  });
}

function pendingAI(){ return P.polys.filter(p => p.ai && !p.approved); }
function openAI(){
  if(P.mode === "osm"){ toast("AI orqali tahlil qilish OSM rejimida hali qo‘shilmagan.", true); return; }
  const n = pendingAI().length;
  openModal({
    title:"AI orqali tahlil qilish", wide:true,
    html:`<p style="margin-top:0">AI turar-joy, sanoat, transport, yashil hudud, suv va yirik jamoat obyektlarini <b>taxminiy</b> aniqlashi mumkin. Natija hech qachon “aniq” deb hisoblanmaydi: poligonlar <i>“AI tomonidan taxminiy aniqlangan”</i> deb belgilanadi va sizning tasdig‘ingizni kutadi.</p>
      <button class="btn primary" id="aiRun">AI tahlilini boshlash</button>
      <p class="err" id="aiMsg" style="color:var(--mute)"></p>
      <label class="f" style="margin-top:10px">Tashqi AI natijasini qo‘shish (JSON)
        <textarea class="field" id="aiJson" spellcheck="false" placeholder='[{"zone":"Turar-joy hududi","points":[[0.10,0.20],[0.30,0.20],[0.25,0.40]]}]'></textarea></label>
      <p class="help">Nuqtalar 0–1 oralig‘ida (rasm o‘lchamiga nisbatan) yoki piksellarda bo‘lishi mumkin. Integratsiya uchun <code>window.FZM_AI({blob, width, height, zones})</code> funksiyasini belgilash kifoya.</p>
      <button class="btn" id="aiAdd">Natijani qo‘shish</button>
      <div id="aiPend" style="margin-top:14px">${n ? aiPendHtml(n) : ""}</div>`,
    actions:[{label:"Yopish"}],
    onMount(ov){
      $("#aiRun", ov).addEventListener("click", async () => {
        const msg = $("#aiMsg", ov);
        if(typeof window.FZM_AI !== "function"){ msg.textContent = "AI xizmati hozircha ulanmagan. Qo‘lda zonalash to‘liq ishlaydi."; return; }
        msg.textContent = "Tahlil qilinmoqda…";
        try{
          const res = await window.FZM_AI({blob: null, width:P.imgW, height:P.imgH, zones:P.zones.map(z=>z.name)});
          const k = importAI(res); msg.textContent = `${k} ta poligon qo‘shildi (AI tomonidan taxminiy aniqlangan).`;
          $("#aiPend", ov).innerHTML = aiPendHtml(pendingAI().length);
        }catch(e){ msg.textContent = "AI tahlili bajarilmadi. Qo‘lda zonalashni davom ettiring."; }
      });
      $("#aiAdd", ov).addEventListener("click", () => {
        const msg = $("#aiMsg", ov);
        try{
          const k = importAI(JSON.parse($("#aiJson", ov).value));
          msg.textContent = k ? `${k} ta poligon qo‘shildi (AI tomonidan taxminiy aniqlangan).` : "Qo‘shiladigan poligon topilmadi.";
          $("#aiPend", ov).innerHTML = aiPendHtml(pendingAI().length);
        }catch(e){ msg.textContent = "JSON formati noto‘g‘ri."; }
      });
      ov.addEventListener("click", e => {
        const b = e.target.closest("button"); if(!b) return;
        if(b.id === "aiOkAll"){ pendingAI().forEach(p => p.approved = true); commit(); refreshAll(); $("#aiPend", ov).innerHTML = ""; }
        if(b.id === "aiDelAll"){ const ids = new Set(pendingAI().map(p=>p.id)); P.polys = P.polys.filter(p => !ids.has(p.id)); S.poly = null; commit(); refreshAll(); $("#aiPend", ov).innerHTML = ""; }
      });
    }
  });
}
function aiPendHtml(n){
  return n ? `<div class="ai-tag">${n} ta poligon tasdiqlanmagan — AI tomonidan taxminiy aniqlangan</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="aiOkAll">Hammasini tasdiqlash</button><button class="btn danger" id="aiDelAll">Hammasini o‘chirish</button></div>
    <p class="help">Alohida poligonni xaritada tanlab, tasdiqlash, o‘zgartirish yoki o‘chirish mumkin.</p>` : "";
}
function importAI(list){
  if(!Array.isArray(list)) throw new Error("bad");
  let k = 0;
  for(const it of list){
    const pts = (it.points || it.pts || []).filter(p => Array.isArray(p) && p.length >= 2 && isFinite(p[0]) && isFinite(p[1]));
    if(pts.length < 3) continue;
    const norm = pts.every(p => p[0] >= 0 && p[0] <= 1 && p[1] >= 0 && p[1] <= 1);
    const abs = pts.map(p => norm ? [p[0]*P.imgW, p[1]*P.imgH] : [clamp(+p[0],0,P.imgW), clamp(+p[1],0,P.imgH)]);
    const nm = String(it.zone || "Boshqa").toLowerCase();
    let z = P.zones.find(z => z.name.toLowerCase() === nm) || P.zones.find(z => z.name === "Boshqa") || P.zones[0];
    if(!z){ z = {id:uid("z"), name:String(it.zone||"Boshqa"), color:"#8E6E53", icon:"•", note:"", opacity:.4, visible:true}; P.zones.push(z); }
    P.polys.push({id:uid("g"), zoneId:z.id, pts:abs, ai:true, approved:false}); k++;
  }
  if(k){ commit(); refreshAll(); }
  return k;
}

/* ---------- PNG eksport ---------- */
function exportSize(q){
  const iw = P.imgW, ih = P.imgH, long = Math.max(iw, ih);
  let f = q === "std" ? Math.min(1, 1600/long) : q === "high" ? Math.min(1, 3200/long) : 1;
  const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  f = Math.min(f, 16384/long, Math.sqrt((IOS ? 16e6 : 120e6)/(iw*ih)), 1);
  return {f, w:Math.round(iw*f), h:Math.round(ih*f)};
}
function openExport(){
  if(P.mode === "osm"){ openPrint(); return; }
  if(!IMG){ toast("Avval hudud rasmini yuklang.", true); return; }
  if(!P.polys.length){ toast("Eksport qilishdan oldin kamida bitta funksional zona yarating.", true); return; }
  const q = {std:exportSize("std"), high:exportSize("high"), max:exportSize("max")};
  openModal({
    title:"PNG sifatida yuklab olish",
    html:`<div class="chk-group">
        <label class="chk"><input type="checkbox" id="exLegend" checked> Legenda</label>
        <label class="chk"><input type="checkbox" id="exNames" checked> Zona nomlari</label>
        <label class="chk"><input type="checkbox" id="exScale" ${P.scale ? "checked" : "disabled"}> Masshtab${P.scale ? "" : " (masshtab belgilanmagan)"}</label>
        <label class="chk"><input type="checkbox" id="exNorth" checked> Shimol belgisi</label>
        <label class="chk"><input type="checkbox" id="exTitle" checked> Loyiha nomi</label>
      </div>
      <div style="margin-top:12px;font-size:12px;color:var(--mute)">Sifat</div>
      <label class="qopt"><input type="radio" name="exq" value="std"> Standard <span class="help" style="margin:0">— ${q.std.w}×${q.std.h} px</span></label>
      <label class="qopt"><input type="radio" name="exq" value="high" checked> High Quality <span class="help" style="margin:0">— ${q.high.w}×${q.high.h} px</span></label>
      <label class="qopt"><input type="radio" name="exq" value="max"> Maximum Quality <span class="help" style="margin:0">— ${q.max.w}×${q.max.h} px${q.max.f < 1 ? " (brauzer chegarasi)" : " (original o‘lcham)"}</span></label>
      <p class="help">Rasmning nisbati (aspect ratio) saqlanadi. Yashirilgan zonalar eksportga kirmaydi.</p>
      <p class="err" id="exErr"></p>`,
    actions:[{label:"Bekor qilish"},{label:"PNG sifatida yuklab olish", cls:"primary", keep:true, onClick:async(ov)=>{
      const o = {
        legend:$("#exLegend",ov).checked, names:$("#exNames",ov).checked, scale:$("#exScale",ov).checked,
        north:$("#exNorth",ov).checked, title:$("#exTitle",ov).checked, q:$('input[name=exq]:checked',ov).value
      };
      $("#exErr", ov).style.color = "var(--mute)"; $("#exErr", ov).textContent = "PNG tayyorlanmoqda…";
      try{
        await new Promise(r => setTimeout(r, 30));
        const ok = await doExport(o);
        if(ok) closeModal(); else $("#exErr", ov).textContent = "";
      }catch(e){
        $("#exErr", ov).style.color = ""; $("#exErr", ov).textContent = "PNG yaratib bo‘lmadi. Pastroq sifatni tanlab ko‘ring.";
      }
      return false;
    }}]
  });
}
async function doExport(o){
  const {f, w, h} = exportSize(o.q);
  const u = clamp(Math.sqrt(w*h)/1000, .6, 10);
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g2 = c.getContext("2d");
  g2.fillStyle = "#fff"; g2.fillRect(0,0,w,h);
  paintMap(g2, {s:f, tx:0, ty:0, W:w, H:h, u, interactive:false, showBase:true, showZones:true, showNames:o.names, showLegend:false});
  g2.strokeStyle = "rgba(20,30,32,.6)"; g2.lineWidth = 2*u; g2.strokeRect(u, u, w-2*u, h-2*u);
  const showLegend = o.legend && legendItems().length > 0;
  if(showLegend) drawLegend(g2, w, h, P.legend.pos, u);
  if(o.title) drawTitle(g2, w, u, P.name);
  if(o.north){
    const corners = ["tr","tl","br","bl"].filter(k => !showLegend || k !== P.legend.pos);
    const k = corners[0], m = 14*u, bw = 44*u, bh = 64*u;
    drawNorth(g2, k[1]==="l" ? m : w - bw - m, k[0]==="t" ? m : h - bh - m, u);
  }
  if(o.scale && P.scale) drawScaleBar(g2, w, h, u, P.scale.pxPerM * f);
  const blob = await new Promise(r => c.toBlob(r, "image/png"));
  if(!blob) throw new Error("blob");
  const safe = (P.name || "zonalash").replace(/[\\/:*?"<>|]+/g, "_").trim() || "zonalash";
  return await saveBlob(blob, safe + ".png");
}
async function saveBlob(blob, filename){
  const ext = (filename.split(".").pop() || "").toUpperCase(), done = () => toast(ext + " tayyor.");
  let dl = null;
  try{ if(window.claude && window.claude.use) dl = await window.claude.use("downloads"); }catch(e){ dl = null; }
  if(dl){
    try{ await dl.save({filename, data:blob}); done(); return true; }
    catch(e){
      if(e && e.code === "declined"){ toast("Yuklab olish bekor qilindi."); return false; }
      toast("Faylni saqlab bo‘lmadi" + (e && e.message ? ": " + e.message : "."), true); return false;
    }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  done(); return true;
}

      <label class="f">Nomi<input type="text" id="zName" value="${esc(z.name)}" maxlength="60"></label>
      <label class="f">Belgi<select id="zIcon">${icons.map(i=>`<option${i===z.icon?" selected":""}>${esc(i)}</option>`).join("")}</select></label>
      <div class="f">Rang
        <div class="row"><input type="color" id="zColor" value="${esc(z.color.toLowerCase())}" aria-label="Rang tanlash"><input class="field" id="zHex" value="${esc(z.color)}" maxlength="7" aria-label="HEX kodi" style="max-width:110px"></div>
        <div class="row rgb"><label>R<input class="field" type="number" min="0" max="255" id="zR" value="${r}"></label><label>G<input class="field" type="number" min="0" max="255" id="zG" value="${gg}"></label><label>B<input class="field" type="number" min="0" max="255" id="zB" value="${b}"></label></div>
      </div>
      <label class="f">Shaffoflik (opacity): <b id="zOpV" style="color:var(--ink)">${Math.round(z.opacity*100)}%</b><input type="range" id="zOp" min="10" max="100" step="1" value="${Math.round(z.opacity*100)}"></label>
      <label class="f">Izoh<textarea id="zNote" rows="2">${esc(z.note||"")}</textarea></label>
      <div class="kv"><span>Zona bo‘yicha</span><b id="zInfo">${esc(zoneInfoText(z))}</b></div>
      ${hasArea() ? "" : `<p class="hint">Maydon hisoblash uchun avval masshtabni belgilang.</p>`}
      <button class="btn danger block" id="zDel">Zonani o‘chirish</button></section>`;
  }

  const osm = P.mode === "osm";
  h += `<section class="sec"><h3>Qatlamlar</h3>
      <label class="chk"><input type="checkbox" id="lyBase" ${L_.base?"checked":""}> ${osm ? "OSM XARITA" : "BASE IMAGE"}</label>
      ${osm ? `<label class="f" style="margin:4px 0 8px">Xarita turi<select id="bmSel">${Object.entries(BASEMAPS).map(([k,b])=>`<option value="${k}"${curBaseKey()===k?" selected":""}>${b.name}</option>`).join("")}</select></label>` : ""}
      <label class="chk"><input type="checkbox" id="lyZones" ${L_.zones?"checked":""}> ZONE LAYER</label>
      <label class="chk"><input type="checkbox" id="lyLabels" ${L_.labels?"checked":""}> LABEL / LEGEND LAYER</label></section>`;

  const pos = [["tl","Yuqori chap"],["tr","Yuqori o‘ng"],["bl","Pastki chap"],["br","Pastki o‘ng"]];
  h += `<section class="sec"><h3>Legenda</h3>
      <label class="chk"><input type="checkbox" id="lgShow" ${P.legend.visible?"checked":""}> Legendani ko‘rsatish</label>
      <label class="chk"><input type="checkbox" id="lgNames" ${P.legend.labels?"checked":""}> Zona nomlarini xaritada ko‘rsatish</label>
      <div class="pos">${pos.map(([k,t])=>`<button class="btn${P.legend.pos===k?" active":""}" data-pos="${k}">${t}</button>`).join("")}</div></section>`;

  h += osm
    ? `<section class="sec"><h3>Masshtab</h3><p class="hint">OSM rejimida masshtab xarita zoom darajasidan avtomatik hisoblanadi — qo‘lda belgilash shart emas.</p></section>`
    : `<section class="sec"><h3>Masshtab</h3>
      <div class="kv"><span>Holati</span><b>${P.scale ? `1 px = ${(1/P.scale.pxPerM).toFixed(3)} m` : "belgilanmagan"}</b></div>
      <button class="btn block" id="scSet">Masshtabni sozlash</button>
      ${P.scale ? `<button class="btn block" id="scClear">Masshtabni o‘chirish</button>` : ""}</section>`;

  $("#right").innerHTML = h;
}

function setZoneColor(z, hex, src){
  z.color = hex;
  if(src !== "zColor"){ const el = $("#zColor"); if(el) el.value = hex.toLowerCase(); }
  if(src !== "zHex"){ const el = $("#zHex"); if(el) el.value = hex; }
  if(!["zR","zG","zB"].includes(src)){ const [r,g,b] = hexToRgb(hex); [["zR",r],["zG",g],["zB",b]].forEach(([id,v])=>{ const el = $("#"+id); if(el) el.value = v; }); }
  renderLeft(); invalidate();
}
const rightEl = $("#right");
rightEl.addEventListener("input", e => {
  if(!P) return;
  const id = e.target.id, z = curZone();
  if(z){
    if(id === "zName"){ z.name = e.target.value; renderLeft(); invalidate(); }
    else if(id === "zNote"){ z.note = e.target.value; scheduleSave(); }
    else if(id === "zColor") setZoneColor(z, e.target.value.toUpperCase(), "zColor");
    else if(id === "zHex"){ if(validHex(e.target.value)) setZoneColor(z, normHex(e.target.value), "zHex"); }
    else if(["zR","zG","zB"].includes(id)){
      const r = +$("#zR").value, gg = +$("#zG").value, b = +$("#zB").value;
      if([r,gg,b].every(v => Number.isFinite(v) && v >= 0 && v <= 255)) setZoneColor(z, rgbToHex(r,gg,b), id);
    }
    else if(id === "zOp"){ z.opacity = clamp(+e.target.value/100, .1, 1); $("#zOpV").textContent = Math.round(z.opacity*100) + "%"; invalidate(); }
  }
});
rightEl.addEventListener("change", e => {
  if(!P) return;
  const id = e.target.id, z = curZone();
  if(z && ["zName","zNote","zColor","zHex","zR","zG","zB","zOp"].includes(id)){
    if(id === "zName" && !e.target.value.trim()){ z.name = "Nomsiz zona"; e.target.value = z.name; renderLeft(); invalidate(); }
    if(id === "zHex" && !validHex(e.target.value)) e.target.value = z.color;
    commit(); return;
  }
  if(z && id === "zIcon"){ z.icon = e.target.value; commit(); renderLeft(); return; }
  if(id === "pZone" && S.poly){ const pl = getPoly(S.poly); pl.zoneId = e.target.value; S.zone = pl.zoneId; commit(); refreshAll(); return; }
  if(id === "bmSel"){ setBasemap(e.target.value); return; }
  if(id === "lyBase"){ L_.base = e.target.checked; invalidate(); }
  else if(id === "lyZones"){ L_.zones = e.target.checked; invalidate(); }
  else if(id === "lyLabels"){ L_.labels = e.target.checked; invalidate(); }
  else if(id === "lgShow"){ P.legend.visible = e.target.checked; commit(); invalidate(); }
  else if(id === "lgNames"){ P.legend.labels = e.target.checked; commit(); invalidate(); }
});
rightEl.addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b || !P) return;
  if(b.dataset.close !== undefined){ closeSheets(); return; }
  if(b.dataset.pos){ P.legend.pos = b.dataset.pos; commit(); renderRight(); invalidate(); return; }
  switch(b.id){
    case "zDel": askDeleteZone(); break;
    case "pDel": deletePoly(); break;
    case "pDelV": deleteVertex(); break;
    case "pApprove": { const pl = getPoly(S.poly); if(pl){ pl.approved = true; commit(); renderRight(); invalidate(); } break; }
    case "scSet": setTool("scale"); toast("Xaritada ma’lum masofaning ikki uchini belgilang."); if(isMobile()) closeSheets(); break;
    case "scClear": P.scale = null; commit(); refreshAll(); break;
  }
});

/* ---------- Mobil panellar ---------- */
function closeSheets(){ $("#left").classList.remove("open"); $("#right").classList.remove("open"); }
function toggleSheet(which){
  const el = $(which === "left" ? "#left" : "#right"), other = $(which === "left" ? "#right" : "#left");
  other.classList.remove("open"); el.classList.toggle("open");
}

/* =====================================================================
   Yuqori panel / holat paneli
   ===================================================================== */
function updateTopUI(){
  if(!P) return;
  $$(".topbar [data-tool]").forEach(b => b.classList.toggle("active", b.dataset.tool === tool));
  $("#bUndo").disabled = !(hi > 0 || (D && D.pts.length));
  $("#bRedo").disabled = !(hi < hist.length-1);
  const db = $("#drawbar"); db.hidden = tool !== "draw";
  if(tool === "draw"){
    const z = curZone();
    $("#dbInfo").innerHTML = z ? `<span class="sw" style="background:${esc(z.color)}"></span><span>${esc(z.name)} · ${D ? D.pts.length : 0} ta nuqta</span>` : "Zona tanlanmagan";
    $("#dbBack").disabled = !(D && D.pts.length);
    $("#dbDone").disabled = !(D && D.pts.length);
    $("#dbCancel").disabled = !D;
  }
  $("#stHint").textContent = tool === "select" ? "Poligonni bosib tanlang · sudrab suring · g‘ildirak — zoom"
    : tool === "draw" ? (P.mode === "osm" ? "Nuqtalarni bosing · birinchi nuqtani bosing yoki Enter — yakunlash · Esc — bekor" : "Nuqtalarni bosing · ikki marta bosing yoki Enter — yakunlash · Esc — bekor")
    : "Ma’lum masofaning ikki uchini bosing";
  $("#stScale").textContent = P.mode === "osm" ? "Masshtab: xaritadan avtomatik" : (P.scale ? `Masshtab: 1 px = ${(1/P.scale.pxPerM).toFixed(3)} m` : "Masshtab belgilanmagan");
  const z11 = $("#z11"); if(z11) z11.hidden = P.mode === "osm";
}
function refreshAll(){ renderLeft(); renderRight(); updateTopUI(); invalidate(); }

$$(".topbar [data-tool]").forEach(b => b.addEventListener("click", () => setTool(b.dataset.tool)));
$("#bUndo").addEventListener("click", undo);
$("#bRedo").addEventListener("click", redo);
$("#bStats").addEventListener("click", openStats);
$("#bAI").addEventListener("click", openAI);
$("#bExport").addEventListener("click", openExport);
$("#bHome").addEventListener("click", leaveProject);
$("#bLeft").addEventListener("click", () => toggleSheet("left"));
$("#bRight").addEventListener("click", () => toggleSheet("right"));
$("#dbBack").addEventListener("click", () => { if(D && D.pts.length){ D.pts.pop(); updateTopUI(); invalidate(); } });
$("#dbDone").addEventListener("click", finishDraw);
$("#dbCancel").addEventListener("click", cancelDraw);
$("#pname").addEventListener("input", e => { if(P) P.name = e.target.value; });
$("#pname").addEventListener("change", e => { if(P){ if(!P.name.trim()){ P.name = "Nomsiz loyiha"; e.target.value = P.name; } commit(); } });
$("#zOut").addEventListener("click", () => { if(P && P.mode === "osm"){ if(osmMap) osmMap.zoomOut(); } else zoomCenter(1/1.25); });
$("#zIn").addEventListener("click", () => { if(P && P.mode === "osm"){ if(osmMap) osmMap.zoomIn(); } else zoomCenter(1.25); });
$("#zFit").addEventListener("click", fitView);
$("#z11").addEventListener("click", () => { const r = 1/V.s; zoomAt(W/2, H/2, r); });

function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  LS.set("fzm-theme", t); readTheme(); invalidate();
}
$("#bTheme").addEventListener("click", () => applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark"));

/* Bosh sahifa */
$("#hNew").addEventListener("click", openNewProject);
$("#hOpen").addEventListener("click", openProjectList);
$("#recent").addEventListener("click", async e => {
  const b = e.target.closest("[data-open]"); if(!b) return;
  try{ await loadProject(b.dataset.open); }catch(_){ toast("Loyihani ochib bo‘lmadi.", true); }
});

/* =====================================================================
   Klaviatura
   ===================================================================== */
window.addEventListener("keydown", e => {
  if(modalEl){ if(e.key === "Escape") closeModal(); return; }
  if(!P) return;
  const tag = (e.target.tagName || "").toLowerCase();
  const typing = (tag === "input" && !["checkbox","range","color","radio","button"].includes(e.target.type)) || tag === "textarea" || tag === "select";
  if((e.ctrlKey || e.metaKey) && !typing){
    const k = e.key.toLowerCase();
    if(k === "z" && !e.shiftKey){ e.preventDefault(); undo(); return; }
    if(k === "y" || (k === "z" && e.shiftKey)){ e.preventDefault(); redo(); return; }
  }
  if(typing || e.ctrlKey || e.metaKey || e.altKey) return;
  switch(e.key){
    case "Escape":
      if(D || SC.pts.length) cancelDraw();
      else if(tool !== "select") setTool("select");
      else if(S.poly){ S.poly = null; S.vertex = -1; renderRight(); invalidate(); }
      break;
    case "Delete": if(S.poly && tool === "select"){ e.preventDefault(); deletePoly(); } break;
    case "Backspace": if(D && D.pts.length){ e.preventDefault(); D.pts.pop(); updateTopUI(); invalidate(); } break;
    case "Enter": if(D){ e.preventDefault(); finishDraw(); } break;
    case " ": if(e.target === document.body || e.target === cv){ e.preventDefault(); spaceDown = true; updateCursor(); } break;
    case "v": case "V": setTool("select"); break;
    case "p": case "P": setTool("draw"); break;
    case "s": case "S": if(P.mode !== "osm") setTool("scale"); break;
    case "f": case "F": fitView(); break;
    case "+": case "=": if(P.mode === "osm"){ if(osmMap) osmMap.zoomIn(); } else zoomCenter(1.25); break;
    case "-": case "_": if(P.mode === "osm"){ if(osmMap) osmMap.zoomOut(); } else zoomCenter(1/1.25); break;
  }
});
window.addEventListener("keyup", e => { if(e.key === " "){ spaceDown = false; updateCursor(); } });

/* =====================================================================
   Ishga tushirish
   ===================================================================== */
async function importEmbedded(proj, asCopy){
  proj.zones.forEach(z => { if(z.visible === undefined) z.visible = true; });
  proj.legend = Object.assign({pos:"tr", visible:true, labels:true}, proj.legend || {});
  if(asCopy){ proj.id = uid("p"); proj.name = (proj.name || "Loyiha") + " (fayldan)"; proj.updatedAt = Date.now(); }
  await dbPut("projects", proj);
  P = proj; IMG = null; IMG_URL = null;
  refreshRecent();
  startSession();
}
(async function init(){
  const saved = LS.get("fzm-theme");
  applyTheme(saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
  const embed = $("#fzm-embed");
  if(embed){
    try{
      const proj = JSON.parse(embed.textContent);
      if(!proj || !proj.id || proj.mode !== "osm" || !Array.isArray(proj.zones) || !Array.isArray(proj.polys)) throw new Error("bad");
      const rec = await dbGet("projects", proj.id).catch(() => null);
      refreshRecent();
      if(!rec){
        await importEmbedded(proj, false);
        toast("Loyiha shu qurilmaga import qilindi va davom ettirilmoqda.");
        return;
      }
      if((proj.updatedAt || 0) > (rec.updatedAt || 0)){
        openModal({
          title:"Loyihaning ikki nusxasi bor",
          html:`<p style="margin:0">Fayldagi nusxa (${esc(fmtDate(proj.updatedAt))}) qurilmadagidan (${esc(fmtDate(rec.updatedAt))}) yangiroq. Qaysi birini ochamiz?</p>
            <p class="help">Fayldagi nusxa alohida yangi loyiha sifatida qo‘shiladi — qurilmadagi loyiha o‘zgarmaydi.</p>`,
          actions:[
            {label:"Qurilmadagini ochish", onClick:() => { loadProject(proj.id).catch(() => toast("Loyihani ochib bo‘lmadi.", true)); }},
            {label:"Fayldagini ochish", cls:"primary", onClick:() => { importEmbedded(proj, true).catch(() => toast("Import qilib bo‘lmadi.", true)); }}
          ]
        });
        return;
      }
      await loadProject(proj.id);
      return;
    }catch(e){ /* buzilgan bo'lsa, oddiy holatda davom etamiz */ }
  }
  refreshRecent();
  const last = LS.get("fzm-last");
  if(last) loadProject(last).catch(() => { LS.del("fzm-last"); });
})();
</script>
