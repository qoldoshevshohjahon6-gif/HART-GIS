<style>
:root{
  --bg:#e8ebe6; --panel:#f5f6f3; --panel2:#ebeee9; --ink:#1c272b; --mute:#65757a; --line:#cdd5cf;
  --accent:#1f6f78; --accent-ink:#ffffff; --danger:#b23a2e; --canvas:#d5dad3; --blank:#ffffff; --edge:#8b9891;
  --shadow:0 8px 28px rgba(15,28,30,.22);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111719; --panel:#192023; --panel2:#222b2f; --ink:#e3e9e6; --mute:#8e9ea3; --line:#2d393e;
    --accent:#5cb5bd; --accent-ink:#0b1416; --danger:#e0685a; --canvas:#0d1214; --blank:#1c2427; --edge:#3b4a50;
    --shadow:0 8px 28px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#111719; --panel:#192023; --panel2:#222b2f; --ink:#e3e9e6; --mute:#8e9ea3; --line:#2d393e;
  --accent:#5cb5bd; --accent-ink:#0b1416; --danger:#e0685a; --canvas:#0d1214; --blank:#1c2427; --edge:#3b4a50;
  --shadow:0 8px 28px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
#app{height:100%;position:relative}
button,input,select,textarea{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:6px 11px;border-radius:6px;cursor:pointer;min-height:34px;white-space:nowrap;flex:none}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
.btn.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.big{min-height:46px;padding:10px 20px;font-size:16px}
.btn.block{display:flex;width:100%;margin-top:8px}
.mob{display:none}

/* ---------- home ---------- */
.home{height:100%;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:48px;align-items:center;padding:32px clamp(20px,7vw,96px);overflow:auto;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:44px 44px;background-position:-1px -1px}
.hcol{background:var(--bg);padding:8px 0}
.home h1{margin:0;font-size:clamp(30px,5vw,50px);line-height:1.06;font-weight:600;letter-spacing:-.025em}
.home h1.brand{display:flex;align-items:center;gap:clamp(12px,2vw,20px)}
.hlogo{width:clamp(56px,9vw,84px);height:auto;flex:none;filter:drop-shadow(0 4px 10px rgba(26,86,168,.28))}
.wm{display:flex;align-items:center;gap:clamp(8px,1.4vw,14px)}
.wm b{font-weight:700;letter-spacing:.01em;color:var(--ink)}
.wm i{width:2px;align-self:stretch;margin:.12em 0;background:#1a56a8;opacity:.8}
.wm em{font-style:normal;font-weight:400;color:#1a56a8}
:root[data-theme="dark"] .wm em{color:#5b9bf0}
:root[data-theme="dark"] .wm i{background:#5b9bf0}
.home .tag{margin:12px 0 26px;font-size:clamp(16px,2vw,20px);color:var(--mute)}
.hbtns{display:flex;gap:10px;flex-wrap:wrap}
.home .note{margin:22px 0 0;max-width:46ch;color:var(--mute)}
#recent{margin-top:26px;max-width:460px}
#recent h2{font-size:13px;font-weight:600;margin:0 0 6px;color:var(--mute)}
.rec{display:flex;width:100%;justify-content:space-between;gap:12px;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);padding:9px 2px;cursor:pointer}
.rec:hover b{color:var(--accent)}
.rec span{color:var(--mute);font-size:12px;white-space:nowrap}
.hart{min-width:0}
.hart svg{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow)}

/* ---------- editor ---------- */
#editor{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.topbar{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;scrollbar-width:thin}
.sep{width:1px;align-self:stretch;background:var(--line);margin:2px 4px;flex:none}
.grow{flex:1 1 auto;min-width:6px}
.pname{font-weight:600;background:transparent;border:1px solid transparent;color:var(--ink);padding:5px 8px;border-radius:6px;width:210px;min-width:110px;flex:none}
.pname:hover,.pname:focus{border-color:var(--line);background:var(--panel2)}
.main{position:relative;display:grid;grid-template-columns:268px minmax(0,1fr) 306px;min-height:0}
.panel{background:var(--panel);overflow:auto;min-height:0;overscroll-behavior:contain}
#left{border-right:1px solid var(--line)}
#right{border-left:1px solid var(--line)}
.stage{position:relative;z-index:0;isolation:isolate;min-width:0;min-height:0;background:var(--canvas);overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:default}
#osmMap{position:absolute;inset:0;width:100%;height:100%;z-index:0}
#osmMap .leaflet-marker-icon{background:none;border:none}
.vtx{width:15px;height:15px;border-radius:50%;background:#fff;border:2px solid var(--accent);box-sizing:border-box}
.vtx.mid{width:11px;height:11px;background:rgba(255,255,255,.6)}
.vtx.first{width:36px;height:36px;background:rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center}
.vtx.first.closeable{cursor:pointer}
.vtx.first i{display:block;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--accent);box-sizing:border-box}
.scl-pt{width:13px;height:13px;border-radius:50%;background:#e08a1e;border:2px solid #fff;box-sizing:border-box}
#hud{position:absolute;inset:0;pointer-events:none;z-index:5}
#hudLegend{position:absolute;background:rgba(255,255,255,.93);color:#1c272b;border:1px solid rgba(20,30,32,.45);border-radius:6px;padding:9px 11px;font-size:12.5px;box-shadow:var(--shadow);min-width:120px}
#hudLegend b{display:block;font-size:11px;font-weight:600;margin-bottom:6px}
#hudLegend .li{display:flex;align-items:center;gap:7px;padding:3px 0}
#hudLegend .sw{width:13px;height:13px;border-radius:3px;border:1px solid rgba(0,0,0,.28);flex:none}
/* ---------- Chop etish rejimi ---------- */
#printFrame{position:absolute;background:transparent;border:2px solid #fff;box-shadow:0 0 0 2000px rgba(10,16,18,.42),0 6px 18px rgba(0,0,0,.35);pointer-events:none;z-index:7}
#printFrame::after{content:"";position:absolute;inset:0;outline:1px dashed rgba(255,255,255,.6);outline-offset:-1px}
.pv-item{position:absolute;pointer-events:auto;cursor:grab;user-select:none;touch-action:none}
.pv-item.dragging{cursor:grabbing;opacity:.92}
.pv-resize{position:absolute;right:-7px;bottom:-7px;width:17px;height:17px;background:var(--accent);border:2px solid #fff;border-radius:50%;cursor:nwse-resize;box-shadow:0 1px 4px rgba(0,0,0,.45);pointer-events:auto;touch-action:none}
#printLegend{background:rgba(255,255,255,.95);color:#1c272b;border:1px solid rgba(20,30,32,.45);border-radius:6px;padding:9px 11px 9px 8px;font-size:12.5px;box-shadow:var(--shadow);min-width:120px}
#printLegend b{display:block;font-size:11px;font-weight:600;margin:0 0 6px 3px}
#printLegend .li{display:flex;align-items:center;gap:7px;padding:3px 3px}
#printLegend .sw{width:13px;height:13px;border-radius:3px;border:1px solid rgba(0,0,0,.28);flex:none}
#printScaleBar{background:rgba(255,255,255,.93);border:1px solid rgba(20,30,32,.45);border-radius:6px;padding:6px 10px;box-shadow:var(--shadow);text-align:center}
#printScaleBar .bar2{display:flex;height:7px;margin-top:4px;border:1px solid #1c272b}
#printScaleBar .bar2 i{flex:1}
#printScaleBar .bar2 i:nth-child(odd){background:#1c272b}
#printScaleBar .bar2 i:nth-child(even){background:#fff}
#printScaleBar .lbl{display:flex;justify-content:space-between;font-size:10px;color:#1c272b;margin-top:2px}
#printNorth{width:38px;height:52px;background:rgba(255,255,255,.93);border:1px solid rgba(20,30,32,.45);border-radius:6px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 12px "IBM Plex Sans",sans-serif;color:#1c272b}
#printNorth .pv-content{display:flex;flex-direction:column;align-items:center}
#printNorth i{width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:16px solid #1c272b;margin-top:3px}
#printTitle{background:rgba(255,255,255,.93);border:1px solid rgba(20,30,32,.45);border-radius:6px;padding:8px 16px;box-shadow:var(--shadow);text-align:center}
#printTitle b{display:block;font-size:15px;font-weight:600;color:#1c272b}
#printTitle span{display:block;font-size:10.5px;color:#5b6b70;margin-top:1px}
#printBar{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:var(--shadow);z-index:30;max-width:calc(100% - 16px);overflow-x:auto;white-space:nowrap}
#printBar select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 7px;min-height:34px}
@media (max-width:820px){ #printBar{top:auto;bottom:66px} }
.srcCards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.srcCard{border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;background:var(--panel2)}
.srcCard.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.srcCard b{display:block;font-size:13px;margin-bottom:3px}
.srcCard span{font-size:11.5px;color:var(--mute)}
#npOsmPick{height:220px;border:1px solid var(--line);border-radius:8px;margin-top:4px;overflow:hidden}
.bottombar{display:flex;align-items:center;gap:10px;padding:4px 8px;background:var(--panel);border-top:1px solid var(--line);font-size:12px;color:var(--mute);overflow-x:auto;white-space:nowrap}
.bottombar .btn{min-height:28px;padding:2px 9px}
.zoomc{display:flex;align-items:center;gap:4px;flex:none}
#zPct{min-width:46px;text-align:center;color:var(--ink);font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}

.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.ph h2{margin:0;font-size:13px;font-weight:600}
.zrow{display:flex;align-items:center;gap:8px;padding:7px 10px 7px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.zrow:hover{background:var(--panel2)}
.zrow.sel{background:color-mix(in srgb,var(--accent) 15%,var(--panel));box-shadow:inset 3px 0 0 var(--accent)}
.sw{width:16px;height:16px;border-radius:4px;border:1px solid rgba(0,0,0,.28);flex:none;display:inline-block}
.zname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zcnt{color:var(--mute);font-size:12px;flex:none}
.eye{border:0;background:none;color:var(--ink);padding:4px;cursor:pointer;display:flex;border-radius:4px;flex:none}
.eye.off{color:var(--mute);opacity:.55}
.sec{padding:12px;border-bottom:1px solid var(--line)}
.sec h3{margin:0 0 9px;font-size:13px;font-weight:600}
.hint{margin:0;color:var(--mute);font-size:12px}
.f{display:block;margin-bottom:9px;font-size:12px;color:var(--mute)}
.f input[type=text],.f input[type=number],.f select,.f textarea,.field{display:block;width:100%;margin-top:3px;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-height:34px}
.f textarea{resize:vertical}
.f input[type=range]{width:100%;margin:6px 0 0;accent-color:var(--accent)}
.row{display:flex;gap:6px;align-items:center;margin-top:3px}
.row .field{margin-top:0}
.rgb label{flex:1;font-size:11px;color:var(--mute)}
.rgb input{margin-top:2px!important;padding:5px 6px!important}
input[type=color]{width:42px;height:34px;padding:2px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);cursor:pointer;flex:none}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mute);margin:4px 0}
.kv b{color:var(--ink);font-weight:500;text-align:right}
.ai-tag{display:inline-block;background:color-mix(in srgb,#e08a1e 22%,transparent);color:var(--ink);border:1px dashed #e08a1e;border-radius:6px;padding:4px 8px;font-size:12px;margin:4px 0 8px}
.chk{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
.pos{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.pos .btn{font-size:12px;padding:5px 6px}

#drawbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:var(--shadow);z-index:10;max-width:calc(100% - 16px);overflow-x:auto;white-space:nowrap}
#drawbar .info{display:flex;align-items:center;gap:7px;padding:0 6px;font-size:12px}

@media (max-width:820px){
  .mob{display:inline-flex}
  .main{grid-template-columns:minmax(0,1fr)}
  .panel{position:absolute;left:0;right:0;bottom:0;max-height:60%;z-index:20;border:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:var(--shadow);transform:translateY(108%);transition:transform .22s ease;visibility:hidden}
  .panel.open{transform:none;visibility:visible}
  .home{grid-template-columns:1fr;gap:26px;align-content:start}
  .pname{width:130px}
  #stHint{display:none}
}
@media (prefers-reduced-motion:reduce){.panel{transition:none}}

/* ---------- modal & toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(8,14,16,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:12px}
.modal{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);width:min(480px,100%);max-height:90%;overflow:auto;padding:18px}
.modal.wide{width:min(620px,100%)}
.modal h2{margin:0 0 12px;font-size:17px;font-weight:600}
.mact{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.err{color:var(--danger);font-size:13px;margin:8px 0 0;min-height:18px}
.help{color:var(--mute);font-size:12px;margin:6px 0 0}
.mlist .rec{padding:10px 2px}
.mrow{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:8px 0}
.mrow .grow b{display:block}
.mrow small{color:var(--mute)}
#toast{position:fixed;left:50%;bottom:calc(58px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;max-width:min(92vw,520px);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:200;font-size:13px;box-shadow:var(--shadow)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:var(--danger);color:#fff}

.stat-top{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat-top div{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.stat-top b{display:block;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.stat-top span{font-size:12px;color:var(--mute)}
.srow{padding:7px 0;border-bottom:1px solid var(--line)}
.srow .l{display:flex;align-items:center;gap:8px}
.srow .l .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .l .v{color:var(--mute);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.srow .l .p{width:48px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--panel2);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%}
.qopt{display:flex;align-items:center;gap:8px;margin:6px 0;cursor:pointer}
textarea.field{min-height:90px;font-size:12px}
</style>
</head>

<script>
"use strict";
/* =====================================================================
   Yordamchi funksiyalar
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = p => p + "_" + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const LS = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
function hexToRgb(h){ h = h.replace("#",""); if(h.length===3) h = h.split("").map(c=>c+c).join(""); const n = parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function rgbToHex(r,g,b){ return "#"+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,"0")).join("").toUpperCase(); }
function rgba(hex,a){ const [r,g,b] = hexToRgb(hex); return `rgba(${r},${g},${b},${a})`; }
function validHex(h){ return /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.test(String(h).trim()); }
function normHex(h){ h = String(h).trim().replace("#",""); if(h.length===3) h = h.split("").map(c=>c+c).join(""); return "#"+h.toUpperCase(); }
const isMobile = () => window.matchMedia("(max-width:820px)").matches;

let toastT = null;
function toast(msg, bad){
  const t = $("#toast"); t.textContent = msg; t.className = "show" + (bad ? " bad" : "");
  clearTimeout(toastT); toastT = setTimeout(()=>{ t.className = ""; }, bad ? 4200 : 2600);
}

/* =====================================================================
   Brauzer xotirasi (IndexedDB): loyiha ma’lumoti va original rasm alohida
   ===================================================================== */
let dbp = null;
function openDB(){
  if(dbp) return dbp;
  dbp = new Promise((res, rej) => {
    try{
      const r = indexedDB.open("fzm-db", 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        if(!d.objectStoreNames.contains("projects")) d.createObjectStore("projects", {keyPath:"id"});
        if(!d.objectStoreNames.contains("images")) d.createObjectStore("images", {keyPath:"id"});
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    }catch(e){ rej(e); }
  });
  return dbp;
}
function tx(store, mode, fn){
  return openDB().then(db => new Promise((res, rej) => {
    const t = db.transaction(store, mode); const st = t.objectStore(store); const r = fn(st);
    t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  }));
}
const dbPut = (s,v) => tx(s,"readwrite",st=>st.put(v));
const dbGet = (s,k) => tx(s,"readonly",st=>st.get(k));
const dbAll = s => tx(s,"readonly",st=>st.getAll());
const dbDel = (s,k) => tx(s,"readwrite",st=>st.delete(k));

/* =====================================================================
   Ma’lumotlar modeli
   ===================================================================== */
const PRESETS = [
  ["Turar-joy hududi","#4A90E2","🏠"],["Jamoat va ma’muriy hudud","#F1C40F","🏛️"],
  ["Savdo va xizmat ko‘rsatish hududi","#E67E22","🛍️"],["Sanoat hududi","#9B59B6","🏭"],
  ["Transport hududi","#7F8C8D","🚉"],["Ko‘kalamzor hudud","#27AE60","🌳"],
  ["Rekreatsiya hududi","#7FD18B","⛲"],["Ta’lim hududi","#C0392B","🎓"],
  ["Tibbiyot hududi","#E84393","🏥"],["Sport hududi","#16A085","⚽"],
  ["Maxsus hudud","#34495E","🛡️"],["Qishloq xo‘jaligi hududi","#B7950B","🌾"],
  ["Suv hududi","#00B4D8","💧"],["Bo‘sh hudud","#BDC3C7","▫️"],["Boshqa","#8E6E53","•"]
];
const ICONS = ["🏠","🏛️","🛍️","🏭","🚉","🌳","⛲","🎓","🏥","⚽","🛡️","🌾","💧","▫️","•","🏗️","🏢","🛒","🕌","⛪","🚧","🅿️","📍"];

let P = null;            // joriy loyiha
let IMG = null;          // yuklangan original rasm (HTMLImageElement) – hech qachon o‘zgartirilmaydi
let IMG_URL = null;
let tool = "select";
let S = {poly:null, vertex:-1, zone:null};
let D = null;            // chizilayotgan polygon {pts, hover, last}
let SC = {pts:[]};       // masshtab nuqtalari
let spaceDown = false;
const V = {s:1, tx:0, ty:0, fitted:true};
const L_ = {base:true, zones:true, labels:true};  // ko‘rinish qatlamlari

function newProjectData(name, w, h){
  return {
    id: uid("p"), name, mode:"image", imgW:w, imgH:h,
    zones: PRESETS.map(([n,c,i]) => ({id:uid("z"), name:n, color:c, icon:i, note:"", opacity:.4, visible:true})),
    polys: [], scale: null,
    legend: {pos:"tr", visible:true, labels:true},
    createdAt: Date.now(), updatedAt: Date.now()
  };
}
function newOsmProjectData(name, lat, lng, zoom){
  return {
    id: uid("p"), name, mode:"osm", view:{lat, lng, zoom},
    zones: PRESETS.map(([n,c,i]) => ({id:uid("z"), name:n, color:c, icon:i, note:"", opacity:.4, visible:true})),
    polys: [], scale: null,
    legend: {pos:"tr", visible:true, labels:true},
    createdAt: Date.now(), updatedAt: Date.now()
  };
}
/* Geodezik (sfera) maydon — OSM rejimida [lat,lng] nuqtalar uchun, m² */
function geoAreaM2(pts){
  if(pts.length < 3) return 0;
  const R = 6378137, rad = Math.PI/180;
  let a = 0;
  for(let i=0;i<pts.length;i++){
    const [lat1,lng1] = pts[i], [lat2,lng2] = pts[(i+1)%pts.length];
    a += (lng2-lng1)*rad * (2 + Math.sin(lat1*rad) + Math.sin(lat2*rad));
  }
  return Math.abs(a * R * R / 2);
}
const zoneMap = () => { const m = {}; P.zones.forEach(z => m[z.id] = z); return m; };
const getPoly = id => P.polys.find(p => p.id === id);
const curZone = () => P.zones.find(z => z.id === S.zone);

/* ---------- Undo / Redo (snapshot) ---------- */
let hist = [], hi = -1;
function snap(){
  return JSON.stringify({name:P.name, zones:P.zones.map(({visible,...r})=>r), polys:P.polys, scale:P.scale, legend:P.legend});
}
function resetHistory(){ hist = [snap()]; hi = 0; updateTopUI(); }
function commit(){
  const s = snap();
  if(s === hist[hi]){ scheduleSave(); return; }
  hist = hist.slice(0, hi+1); hist.push(s);
  if(hist.length > 200) hist.shift();
  hi = hist.length - 1;
  updateTopUI(); scheduleSave();
}
function restore(i){
  const d = JSON.parse(hist[i]);
  const vis = {}; P.zones.forEach(z => vis[z.id] = z.visible);
  P.name = d.name; P.zones = d.zones.map(z => ({...z, visible: z.id in vis ? vis[z.id] : true}));
  P.polys = d.polys; P.scale = d.scale; P.legend = d.legend;
  D = null; SC.pts = [];
  if(!P.zones.find(z => z.id === S.zone)) S.zone = P.zones[0] ? P.zones[0].id : null;
  if(S.poly && !getPoly(S.poly)){ S.poly = null; S.vertex = -1; }
  $("#pname").value = P.name;
  refreshAll(); scheduleSave();
}
function undo(){
  if(D && D.pts.length){ D.pts.pop(); updateTopUI(); invalidate(); return; }
  if(hi > 0){ hi--; restore(hi); }
}
function redo(){ if(hi < hist.length-1){ hi++; restore(hi); } }

/* ---------- Saqlash ---------- */
let saveT = null;
function scheduleSave(){
  $("#stSave").textContent = "Saqlanmoqda…";
  clearTimeout(saveT); saveT = setTimeout(saveNow, 450);
}
async function saveNow(){
  clearTimeout(saveT);
  if(!P) return;
  try{
    P.updatedAt = Date.now();
    await dbPut("projects", JSON.parse(JSON.stringify(P)));
    $("#stSave").textContent = "Saqlandi ✓";
  }catch(e){
    $("#stSave").textContent = "Brauzer xotirasiga saqlab bo‘lmadi";
  }
}
window.addEventListener("beforeunload", () => { if(P) saveNow(); });
document.addEventListener("visibilitychange", () => { if(document.hidden && P) saveNow(); });

/* =====================================================================
   Geometriya
   ===================================================================== */
const toImg = (x,y) => ({x:(x - V.tx)/V.s, y:(y - V.ty)/V.s});
const toScr = (x,y) => [x*V.s + V.tx, y*V.s + V.ty];
function pointInPoly(x,y,pts){
  let inside = false;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){
    const [xi,yi]=pts[i],[xj,yj]=pts[j];
    if(((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) inside = !inside;
  }
  return inside;
}
function polyAreaPx(pts){
  let a = 0;
  for(let i=0;i<pts.length;i++){ const [x1,y1]=pts[i],[x2,y2]=pts[(i+1)%pts.length]; a += x1*y2 - x2*y1; }
  return Math.abs(a)/2;
}
function labelPoint(pts){
  let a=0,cx=0,cy=0; const n=pts.length;
  for(let i=0;i<n;i++){ const [x1,y1]=pts[i],[x2,y2]=pts[(i+1)%n]; const f=x1*y2-x2*y1; a+=f; cx+=(x1+x2)*f; cy+=(y1+y2)*f; }
  if(Math.abs(a)<1e-9) return pts[0];
  a*=.5; cx/=(6*a); cy/=(6*a);
  const xs=[];
  for(let i=0;i<n;i++){
    const [x1,y1]=pts[i],[x2,y2]=pts[(i+1)%n];
    if((y1<=cy&&y2>cy)||(y2<=cy&&y1>cy)) xs.push(x1+(cy-y1)*(x2-x1)/(y2-y1));
  }
  xs.sort((p,q)=>p-q);
  let best=null,bl=-1;
  for(let i=0;i+1<xs.length;i+=2){ const l=xs[i+1]-xs[i]; if(l>bl){bl=l;best=(xs[i]+xs[i+1])/2;} }
  return best==null ? [cx,cy] : [best,cy];
}
const m2of = px => P.scale ? px/(P.scale.pxPerM*P.scale.pxPerM) : null;
const polyM2 = pl => P.mode === "osm" ? geoAreaM2(pl.pts) : m2of(polyAreaPx(pl.pts));
const hasArea = () => P.mode === "osm" || !!P.scale;
function fmtArea(m2){
  if(m2==null) return null;
  if(m2 < 10000) return Math.round(m2).toLocaleString("en-US").replace(/,/g," ")+" m²";
  return (m2/10000).toFixed(2)+" ga";
}
function computeStats(){
  const osm = P.mode === "osm";
  const rows = P.zones.map(z => {
    const ps = P.polys.filter(p => p.zoneId === z.id);
    const px = osm ? ps.reduce((a,p)=>a+geoAreaM2(p.pts),0) : ps.reduce((a,p)=>a+polyAreaPx(p.pts),0);
    return {z, count:ps.length, px, m2: osm ? px : m2of(px)};
  }).filter(r => r.count > 0);
  return {rows, totalPx: rows.reduce((a,r)=>a+r.px,0)};
}
function legendItems(){
  const cnt = {}; P.polys.forEach(p => cnt[p.zoneId] = (cnt[p.zoneId]||0)+1);
  return P.zones.filter(z => cnt[z.id] && z.visible);
}

/* =====================================================================
   Chizish (Canvas) – ekran va eksport uchun bitta funksiya
   ===================================================================== */
const cv = $("#cv"), ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1, needs = false, theme = {};
function readTheme(){
  const cs = getComputedStyle(document.documentElement);
  theme = {blank: cs.getPropertyValue("--blank").trim()||"#fff", edge: cs.getPropertyValue("--edge").trim()||"#888", accent: cs.getPropertyValue("--accent").trim()||"#1f6f78"};
}
function invalidate(){
  if(P && P.mode === "osm"){ syncOsm(); return; }
  if(!needs){ needs = true; requestAnimationFrame(frame); }
}
function resize(){
  const r = cv.getBoundingClientRect(); DPR = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  cv.width = Math.max(1, Math.round(W*DPR)); cv.height = Math.max(1, Math.round(H*DPR));
  if(P && P.mode !== "osm" && V.fitted) fitView();
  invalidate();
}
new ResizeObserver(resize).observe(cv);
new ResizeObserver(() => { if(osmMap) osmMap.invalidateSize(); }).observe($("#stage"));

function frame(){
  needs = false;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  if(!P || !IMG) return;
  paintMap(ctx, {
    s:V.s, tx:V.tx, ty:V.ty, W, H, u:1, interactive:true,
    showBase:L_.base, showZones:L_.zones,
    showNames: L_.labels && P.legend.labels,
    showLegend: L_.labels && P.legend.visible
  });
  $("#zPct").textContent = Math.round(V.s*100) + "%";
}

function drawLabelText(c, text, x, y, u){
  c.font = `600 ${12*u}px "IBM Plex Sans",system-ui,sans-serif`;
  c.textAlign = "center"; c.textBaseline = "middle";
  c.lineJoin = "round"; c.lineWidth = 3.5*u; c.strokeStyle = "rgba(255,255,255,.92)";
  c.strokeText(text, x, y);
  c.fillStyle = "#151d20"; c.fillText(text, x, y);
}

function paintMap(c, o){
  const {s, tx, ty, u} = o;
  const iw = P.imgW, ih = P.imgH;
  const X = x => x*s+tx, Y = y => y*s+ty;
  const zm = zoneMap();

  // 1) BASE IMAGE – faqat ko‘rsatiladi, o‘zgartirilmaydi
  if(o.showBase){
    c.imageSmoothingEnabled = true; c.imageSmoothingQuality = "high";
    // Jonli ko'rinishda sub-piksel noaniqligidan kelib chiqadigan hiralashishni kamaytirish uchun,
    // chizish nuqtasini qurilma pikseliga moslab yaxlitlaymiz (eksportda bu qo'llanmaydi).
    const dx = o.interactive ? Math.round(tx*DPR)/DPR : tx;
    const dy = o.interactive ? Math.round(ty*DPR)/DPR : ty;
    c.drawImage(IMG, dx, dy, iw*s, ih*s);
  }else{
    c.fillStyle = o.interactive ? theme.blank : "#fff"; c.fillRect(tx, ty, iw*s, ih*s);
  }
  if(o.interactive){ c.strokeStyle = theme.edge; c.lineWidth = 1; c.strokeRect(tx-.5, ty-.5, iw*s+1, ih*s+1); }

  // 2) ZONE LAYER
  if(o.showZones){
    for(const p of P.polys){
      const z = zm[p.zoneId]; if(!z || !z.visible) continue;
      c.beginPath();
      p.pts.forEach(([x,y],i) => i ? c.lineTo(X(x),Y(y)) : c.moveTo(X(x),Y(y)));
      c.closePath();
      c.fillStyle = rgba(z.color, z.opacity); c.fill();
      c.lineWidth = 1.6*u; c.strokeStyle = rgba(z.color, .95); c.lineJoin = "round";
      if(p.ai && !p.approved) c.setLineDash([7*u,4*u]);
      c.stroke(); c.setLineDash([]);
    }
  }

  // 3) Zona nomlari
  if(o.showNames && o.showZones){
    for(const p of P.polys){
      const z = zm[p.zoneId]; if(!z || !z.visible) continue;
      let minx=1e12,maxx=-1e12,miny=1e12,maxy=-1e12;
      p.pts.forEach(([x,y])=>{ minx=Math.min(minx,X(x));maxx=Math.max(maxx,X(x));miny=Math.min(miny,Y(y));maxy=Math.max(maxy,Y(y)); });
      if(maxx-minx < 34*u || maxy-miny < 16*u) continue;
      const [lx,ly] = labelPoint(p.pts);
      drawLabelText(c, z.name + (p.ai && !p.approved ? " (AI)" : ""), X(lx), Y(ly), u);
    }
  }

  if(o.interactive){
    // Tanlangan polygon
    if(tool === "select" && S.poly){
      const pl = getPoly(S.poly);
      if(pl && zm[pl.zoneId] && zm[pl.zoneId].visible){
        c.beginPath();
        pl.pts.forEach(([x,y],i)=> i ? c.lineTo(X(x),Y(y)) : c.moveTo(X(x),Y(y)));
        c.closePath();
        c.lineJoin = "round"; c.lineWidth = 4.5; c.strokeStyle = "rgba(255,255,255,.9)"; c.stroke();
        c.lineWidth = 2; c.strokeStyle = theme.accent; c.stroke();
        const n = pl.pts.length;
        for(let i=0;i<n;i++){
          const a = pl.pts[i], b = pl.pts[(i+1)%n];
          const ax=X(a[0]),ay=Y(a[1]),bx=X(b[0]),by=Y(b[1]);
          if(Math.hypot(ax-bx,ay-by) < 28) continue;
          c.beginPath(); c.arc((ax+bx)/2,(ay+by)/2,4,0,7);
          c.fillStyle="rgba(255,255,255,.55)"; c.fill(); c.lineWidth=1.5; c.strokeStyle=theme.accent; c.stroke();
        }
        pl.pts.forEach(([x,y],i)=>{
          c.beginPath(); c.arc(X(x),Y(y), i===S.vertex?7:5.5, 0, 7);
          c.fillStyle = i===S.vertex ? theme.accent : "#fff"; c.fill();
          c.lineWidth = 2; c.strokeStyle = i===S.vertex ? "#fff" : theme.accent; c.stroke();
        });
      }
    }
    // Chizilayotgan polygon
    if(D){
      const z = curZone(); const col = z ? z.color : "#ffffff";
      const pts = D.pts.map(p => [X(p[0]), Y(p[1])]);
      if(pts.length >= 3){
        c.beginPath(); pts.forEach((p,i)=> i ? c.lineTo(p[0],p[1]) : c.moveTo(p[0],p[1])); c.closePath();
        c.fillStyle = rgba(col, .28); c.fill();
      }
      if(pts.length){
        c.beginPath(); pts.forEach((p,i)=> i ? c.lineTo(p[0],p[1]) : c.moveTo(p[0],p[1]));
        if(D.hover) c.lineTo(X(D.hover.x), Y(D.hover.y));
        c.lineJoin="round"; c.lineWidth = 4; c.strokeStyle = "rgba(255,255,255,.85)"; c.stroke();
        c.lineWidth = 2; c.strokeStyle = col; c.stroke();
        pts.forEach((p,i)=>{
          const first = i===0 && pts.length>=3;
          c.beginPath(); c.arc(p[0],p[1], first?8:4.5, 0, 7);
          c.fillStyle = first ? rgba(col,.35) : "#fff"; c.fill();
          c.lineWidth = 2; c.strokeStyle = col; c.stroke();
        });
      }
    }
    // Masshtab chizig‘i
    const sp = SC.pts.length ? SC.pts.slice() : (P.scale ? [P.scale.p1, P.scale.p2] : []);
    if(sp.length){
      const warn = "#e08a1e";
      const a = sp[0], b = sp[1];
      if(b){
        c.beginPath(); c.moveTo(X(a[0]),Y(a[1])); c.lineTo(X(b[0]),Y(b[1]));
        c.lineWidth = 4; c.strokeStyle = "rgba(255,255,255,.85)"; c.stroke();
        c.lineWidth = 2; c.strokeStyle = warn; c.stroke();
        if(P.scale && !SC.pts.length){
          drawLabelText(c, `${P.scale.meters} m`, (X(a[0])+X(b[0]))/2, (Y(a[1])+Y(b[1]))/2 - 12, 1);
        }
      }
      sp.forEach(p=>{ c.beginPath(); c.arc(X(p[0]),Y(p[1]),5,0,7); c.fillStyle=warn; c.fill(); c.lineWidth=2; c.strokeStyle="#fff"; c.stroke(); });
    }
  }

  // 4) LEGEND layer
  if(o.showLegend) drawLegend(c, o.W, o.H, P.legend.pos, u);
  if(!o.interactive) return;
}

/* ---------- Legenda, shimol belgisi, masshtab chizig‘i, sarlavha ---------- */
function legendBox(c, W, H, pos, u){
  const items = legendItems(); if(!items.length) return null;
  const pad = 10*u, sw = 14*u, gap = 8*u, rh = 21*u, title = "FUNKSIONAL ZONALASH";
  c.font = `600 ${11*u}px "IBM Plex Sans",system-ui,sans-serif`;
  let tw = c.measureText(title).width;
  c.font = `400 ${12.5*u}px "IBM Plex Sans",system-ui,sans-serif`;
  items.forEach(z => { tw = Math.max(tw, sw + gap + c.measureText(z.name).width); });
  const bw = tw + pad*2, bh = pad*2 + 18*u + items.length*rh;
  const m = 14*u;
  const x = pos[1]==="l" ? m : W - bw - m;
  const y = pos[0]==="t" ? m : H - bh - m;
  return {x,y,bw,bh,items,pad,sw,gap,rh,title,u};
}
function drawLegend(c, W, H, pos, u){
  const b = legendBox(c, W, H, pos, u); if(!b) return;
  const {x,y,bw,bh,items,pad,sw,gap,rh,title} = b;
  c.save();
  c.fillStyle = "rgba(255,255,255,.93)"; c.strokeStyle = "rgba(20,30,32,.45)"; c.lineWidth = 1*u;
  roundRect(c, x, y, bw, bh, 5*u); c.fill(); c.stroke();
  c.fillStyle = "#1c272b"; c.textAlign = "left"; c.textBaseline = "middle";
  c.font = `600 ${11*u}px "IBM Plex Sans",system-ui,sans-serif`;
  c.fillText(title, x+pad, y+pad+7*u);
  c.font = `400 ${12.5*u}px "IBM Plex Sans",system-ui,sans-serif`;
  items.forEach((z,i) => {
    const ry = y + pad + 18*u + i*rh + rh/2;
    c.fillStyle = rgba(z.color, .85); c.fillRect(x+pad, ry-sw/2, sw, sw);
    c.strokeStyle = "rgba(0,0,0,.45)"; c.lineWidth = 1*u; c.strokeRect(x+pad, ry-sw/2, sw, sw);
    c.fillStyle = "#1c272b"; c.fillText(z.name, x+pad+sw+gap, ry);
  });
  c.restore();
}
function roundRect(c,x,y,w,h,r){
  c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}
function drawNorth(c, x, y, u){
  const w = 44*u, h = 64*u;
  c.save();
  c.fillStyle = "rgba(255,255,255,.93)"; c.strokeStyle = "rgba(20,30,32,.45)"; c.lineWidth = 1*u;
  roundRect(c, x, y, w, h, 5*u); c.fill(); c.stroke();
  const cx = x + w/2;
  c.fillStyle = "#1c272b"; c.font = `700 ${14*u}px "IBM Plex Sans",system-ui,sans-serif`; c.textAlign="center"; c.textBaseline="middle";
  c.fillText("N", cx, y + 12*u);
  c.beginPath(); c.moveTo(cx, y+22*u); c.lineTo(cx-10*u, y+54*u); c.lineTo(cx, y+47*u); c.closePath(); c.fillStyle="#1c272b"; c.fill();
  c.beginPath(); c.moveTo(cx, y+22*u); c.lineTo(cx+10*u, y+54*u); c.lineTo(cx, y+47*u); c.closePath(); c.fillStyle="#fff"; c.fill(); c.strokeStyle="#1c272b"; c.lineWidth=1.2*u; c.stroke();
  c.restore();
}
function drawTitle(c, W, u, name){
  c.save();
  c.font = `600 ${20*u}px "IBM Plex Sans",system-ui,sans-serif`;
  let t = name; const maxW = W*0.5;
  while(c.measureText(t).width > maxW && t.length > 4) t = t.slice(0,-2);
  if(t !== name) t += "…";
  const tw = c.measureText(t).width;
  const sub = "Funksional zonalash xaritasi";
  c.font = `400 ${11.5*u}px "IBM Plex Sans",system-ui,sans-serif`;
  const sw = c.measureText(sub).width;
  const bw = Math.max(tw, sw) + 32*u, bh = 54*u, x = (W-bw)/2, y = 14*u;
  c.fillStyle = "rgba(255,255,255,.93)"; c.strokeStyle = "rgba(20,30,32,.45)"; c.lineWidth = 1*u;
  roundRect(c, x, y, bw, bh, 5*u); c.fill(); c.stroke();
  c.fillStyle = "#1c272b"; c.textAlign="center"; c.textBaseline="middle";
  c.font = `600 ${20*u}px "IBM Plex Sans",system-ui,sans-serif`; c.fillText(t, W/2, y+22*u);
  c.fillStyle = "#5b6b70"; c.font = `400 ${11.5*u}px "IBM Plex Sans",system-ui,sans-serif`; c.fillText(sub, W/2, y+41*u);
  c.restore();
}
function drawScaleBar(c, W, H, u, outPxPerM){
  const nice = [0.5,1,2,5,10,20,25,50,100,200,250,500,1000,2000,2500,5000,10000,20000,50000,100000];
  const target = W*0.17; let len = nice[0];
  for(const n of nice){ if(n*outPxPerM <= target) len = n; }
  const bw = len*outPxPerM, lab = v => v>=1000 ? (v/1000)+" km" : v+" m";
  const pad = 10*u, bh = 8*u;
  const boxW = bw + pad*2 + 40*u, boxH = pad*2 + bh + 16*u;
  const x = (W-boxW)/2, y = H - boxH - 14*u;
  c.save();
  c.fillStyle = "rgba(255,255,255,.93)"; c.strokeStyle = "rgba(20,30,32,.45)"; c.lineWidth = 1*u;
  roundRect(c, x, y, boxW, boxH, 5*u); c.fill(); c.stroke();
  const bx = x + pad + 20*u, by = y + pad + 14*u;
  c.fillStyle = "#1c272b"; c.fillRect(bx, by, bw/2, bh);
  c.fillStyle = "#fff"; c.fillRect(bx+bw/2, by, bw/2, bh);
  c.strokeStyle = "#1c272b"; c.lineWidth = 1.2*u; c.strokeRect(bx, by, bw, bh);
  c.fillStyle = "#1c272b"; c.font = `500 ${11*u}px "IBM Plex Sans",system-ui,sans-serif`; c.textBaseline="alphabetic"; c.textAlign="center";
  c.fillText("0", bx, by-4*u); c.fillText(lab(len/2), bx+bw/2, by-4*u); c.fillText(lab(len), bx+bw, by-4*u);
  c.restore();
}

/* =====================================================================
   OSM (Leaflet) xarita dvigateli — "rasm" rejimidagi bilan bir xil
   ma'lumot modeli (P.zones / P.polys) ustida ishlaydi, faqat nuqtalar
   piksel o‘rniga [lat,lng] sifatida saqlanadi.
   ===================================================================== */
const ONLINE = /^https?:$/.test(location.protocol);   // sayt orqali ochilganda rasmiy OSM ishlaydi
const DEF_BASE = ONLINE ? "osm" : "osmfr";
const BASEMAPS = {
  osm:{name:"OSM standart (rasmiy)"+(ONLINE?"":" — faqat sayt orqali ochilganda"), url:"https://tile.openstreetmap.org/{z}/{x}/{y}.png", opts:{maxZoom:19}, attr:"&copy; OpenStreetMap contributors", cors:true},
  osmfr:{name:"OSM xaritasi (OSM Fransiya) — tavsiya", url:"https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png", opts:{subdomains:"abc", maxZoom:20}, attr:"&copy; OpenStreetMap contributors, OSM France", cors:true},
  sat:{name:"Sun’iy yo‘ldosh (Esri)", url:"https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", opts:{maxZoom:19}, attr:"Tiles &copy; Esri — Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community", cors:true},
  hot:{name:"OSM Humanitar (HOT)", url:"https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png", opts:{subdomains:"abc", maxZoom:20}, attr:"&copy; OpenStreetMap contributors, HOT"},
  osmde:{name:"OSM xaritasi (OSM Germaniya)", url:"https://tile.openstreetmap.de/{z}/{x}/{y}.png", opts:{maxZoom:19}, attr:"&copy; OpenStreetMap contributors, openstreetmap.de"},
  carto:{name:"Ko‘cha xaritasi (CARTO)", url:"https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", opts:{subdomains:"abcd", maxZoom:20}, attr:"&copy; OpenStreetMap contributors, &copy; CARTO"}
};
function makeTiles(key, onFail){
  const b = BASEMAPS[key] || BASEMAPS[DEF_BASE];
  const t = L.tileLayer(b.url, Object.assign({attribution:b.attr}, b.cors ? {crossOrigin:true} : {}, b.opts));
  if(key === "osm" && onFail){
    fetch("https://tile.openstreetmap.org/0/0/0.png", {cache:"no-store"})
      .then(r => { if(r.status === 403 || r.status === 418){ toast("Bu qurilmada rasmiy OSM bloklangan (Referer yo‘q) — OSM Fransiyaga o‘tildi.", true); onFail("osmfr"); } })
      .catch(() => {});
  }
  let n = 0;
  t.on("tileerror", () => {
    if(++n !== (key === "osm" ? 2 : 4)) return;
    if(navigator.onLine === false){ toast("Internet ulanishi yo‘q — xarita plitkalari yuklanmayapti.", true); return; }
    if(key !== "osmfr"){
      toast(key === "osm" ? "Rasmiy OSM faqat sayt (https) orqali ochilganda ishlaydi — OSM Fransiyaga o‘tildi." : `“${b.name}” ochilmadi — OSM Fransiyaga o‘tildi.`, true);
      if(onFail) onFail("osmfr");
    }else toast("Xarita plitkalari yuklanmayapti. Internetni tekshiring yoki sun’iy yo‘ldosh xaritasini tanlang.", true);
  });
  return t;
}
const curBaseKey = () => osmTempBase || P.view.base || DEF_BASE;
function setBasemap(key, temp){
  if(!osmMap) return;
  if(temp) osmTempBase = key; else { osmTempBase = null; P.view.base = key; scheduleSave(); }
  if(osmTiles && osmMap.hasLayer(osmTiles)) osmMap.removeLayer(osmTiles);
  osmTiles = makeTiles(key, k => { setBasemap(k, true); renderRight(); });
  if(L_.base) osmTiles.addTo(osmMap);
}
let osmMap = null, osmTiles = null, osmZonesGrp = null, osmDrawGrp = null, osmVertGrp = null, osmPolyLayers = {}, osmHoverLine = null, osmTempBase = null;
function initOsm(){
  teardownOsm();
  osmMap = L.map("osmMap", {attributionControl:true, zoomControl:false})
    .setView([P.view.lat, P.view.lng], P.view.zoom);
  if(!isMobile()) L.control.zoom({position:"bottomright"}).addTo(osmMap);
  osmTempBase = null;
  osmTiles = makeTiles(P.view.base || DEF_BASE, k => { setBasemap(k, true); renderRight(); }).addTo(osmMap);
  osmZonesGrp = L.layerGroup().addTo(osmMap);
  osmDrawGrp = L.layerGroup().addTo(osmMap);
  osmVertGrp = L.layerGroup().addTo(osmMap);
  osmMap._fzmZones = osmZonesGrp;
  osmMap.on("click", osmMapClick);
  osmMap.on("dblclick", e => { if(tool === "draw" && D && D.pts.length >= 3){ L.DomEvent.stop(e); finishDraw(); } });
  osmMap.on("mousemove", e => { if(tool === "draw" && D && D.pts.length){ D.hover = [e.latlng.lat, e.latlng.lng]; if(osmHoverLine) osmHoverLine.setLatLngs([D.pts[D.pts.length-1], D.hover]); else invalidate(); } });
  osmMap.getContainer().addEventListener("mouseleave", () => { if(D){ D.hover = null; invalidate(); } });
  osmMap.on("moveend zoomend", () => { Object.assign(P.view, {lat:osmMap.getCenter().lat, lng:osmMap.getCenter().lng, zoom:osmMap.getZoom()}); scheduleSave(); });
  osmMap.on("move zoom moveend zoomend", () => { if(printOn) layoutPrint(); });
  syncOsm();
}
function teardownOsm(){
  if(osmMap){ osmMap.off(); osmMap.remove(); }
  osmMap = osmTiles = osmZonesGrp = osmDrawGrp = osmVertGrp = null; osmPolyLayers = {}; osmHoverLine = null;
}
function osmMapClick(e){
  if(spaceDown) return;
  if(tool === "select"){
    if(!e.originalEvent._fzmPoly){ S.poly = null; S.vertex = -1; renderLeft(); renderRight(); syncOsm(); }
    return;
  }
  if(tool !== "draw") return;
  if(!S.zone){ toast("Avval zonani tanlang yoki yangi zona yarating.", true); if(isMobile()) toggleSheet("left"); return; }
  if(!D) D = {pts:[], hover:null, last:null};
  const pt = [e.latlng.lat, e.latlng.lng];
  const cp = osmMap.latLngToContainerPoint(e.latlng);
  const now = performance.now();
  if(D.last && now - D.last.t < 350 && D.last.cp.distanceTo(cp) < 12){ D.last = null; return; }
  D.last = {t: now, cp: cp};
  D.pts.push(pt);
  updateTopUI(); invalidate();
}
function osmVertexIcon(cls, closeable){
  const first = cls === "first";
  return L.divIcon({
    className:"",
    html: first ? `<div class="vtx first${closeable?" closeable":""}"><i></i></div>` : `<div class="vtx ${cls||""}"></div>`,
    iconSize: first ? [36,36] : (cls==="mid" ? [11,11] : [15,15]),
    iconAnchor: first ? [18,18] : (cls==="mid" ? [5,5] : [7,7])
  });
}
function syncOsm(){
  if(!osmMap) return;
  const zm = zoneMap();
  osmZonesGrp.clearLayers(); osmVertGrp.clearLayers(); osmDrawGrp.clearLayers(); osmPolyLayers = {}; osmHoverLine = null;
  if(L_.base){ if(!osmMap.hasLayer(osmTiles)) osmTiles.addTo(osmMap); } else if(osmMap.hasLayer(osmTiles)) osmMap.removeLayer(osmTiles);

  if(L_.zones){
    for(const pl of P.polys){
      const z = zm[pl.zoneId]; if(!z || !z.visible) continue;
      const sel = pl.id === S.poly;
      const poly = L.polygon(pl.pts, {
        color: z.color, weight: sel ? 3 : 1.6, opacity:.95, fillColor:z.color, fillOpacity:z.opacity,
        dashArray: pl.ai && !pl.approved ? "7 4" : null
      });
      if(L_.labels && P.legend.labels){
        poly.bindTooltip(esc((z.icon?z.icon+" ":"") + z.name + (pl.ai && !pl.approved ? " (AI)" : "")), {permanent:true, direction:"center", className:"", opacity:.95});
      }
      poly.on("click", ev => {
        ev.originalEvent._fzmPoly = true;
        if(tool !== "select") return;
        L.DomEvent.stop(ev);
        S.poly = pl.id; S.vertex = -1; S.zone = pl.zoneId;
        renderLeft(); renderRight(); syncOsm();
      });
      poly.addTo(osmZonesGrp); osmPolyLayers[pl.id] = poly;
    }
  }

  // Tanlangan poligon uchun tepalik/o‘rta-nuqta belgilar
  const selPl = S.poly && getPoly(S.poly);
  if(tool === "select" && selPl && zm[selPl.zoneId] && zm[selPl.zoneId].visible){
    const n = selPl.pts.length;
    for(let i=0;i<n;i++){
      const a = selPl.pts[i], b = selPl.pts[(i+1)%n];
      const mid = [(a[0]+b[0])/2, (a[1]+b[1])/2];
      L.marker(mid, {icon:osmVertexIcon("mid"), draggable:false})
        .on("click", ev => { L.DomEvent.stop(ev); selPl.pts.splice(i+1, 0, mid); S.vertex = i+1; commit(); refreshAll(); })
        .addTo(osmVertGrp);
    }
    selPl.pts.forEach((pt,i) => {
      const mk = L.marker(pt, {icon:osmVertexIcon(i===S.vertex?"first":""), draggable:true});
      mk.on("drag", ev => {
        const ll = ev.target.getLatLng();
        selPl.pts[i] = [ll.lat, ll.lng];
        const lay = osmPolyLayers[selPl.id]; if(lay) lay.setLatLngs(selPl.pts);
        updateAreaUI();
      });
      mk.on("dragend", () => { commit(); updateAreaUI(); setTimeout(invalidate, 0); });
      mk.on("click", ev => { L.DomEvent.stop(ev); S.vertex = i; renderRight(); syncOsm(); });
      mk.on("dblclick", ev => { L.DomEvent.stop(ev); S.vertex = i; deleteVertex(); });
      mk.addTo(osmVertGrp);
    });
  }

  // Chizilayotgan poligon
  if(D && D.pts.length){
    const z = curZone(); const col = z ? z.color : "#ffffff";
    if(D.pts.length >= 2) L.polyline(D.pts, {color:col, weight:3}).addTo(osmDrawGrp);
    if(D.hover) osmHoverLine = L.polyline([D.pts[D.pts.length-1], D.hover], {color:col, weight:2, dashArray:"6 6", interactive:false}).addTo(osmDrawGrp);
    if(D.pts.length >= 3) L.polygon(D.pts, {color:col, weight:2, fillColor:col, fillOpacity:.18, interactive:false}).addTo(osmDrawGrp);
    D.pts.forEach((pt,i) => {
      const mk = L.marker(pt, {icon:osmVertexIcon(i===0?"first":"", D.pts.length>=3), interactive:i===0 && D.pts.length>=3});
      if(i === 0 && D.pts.length >= 3) mk.on("click", ev => { L.DomEvent.stop(ev); finishDraw(); });
      mk.addTo(osmDrawGrp);
    });
  }

  // Legenda (HUD)
  const hud = $("#hudLegend");
  if(hud){
    const items = legendItems();
    if(L_.labels && P.legend.visible && items.length && !printOn){
      hud.style.display = "block";
      hud.innerHTML = `<b>FUNKSIONAL ZONALASH</b>` + items.map(z => `<div class="li"><span class="sw" style="background:${esc(z.color)}"></span>${esc(z.icon)} ${esc(z.name)}</div>`).join("");
      const pos = P.legend.pos, m = "14px";
      hud.style.top = pos[0]==="t" ? m : ""; hud.style.bottom = pos[0]==="b" ? m : "";
      hud.style.left = pos[1]==="l" ? m : ""; hud.style.right = pos[1]==="r" ? m : "";
    }else hud.style.display = "none";
  }
  $("#zPct").textContent = "Zoom " + osmMap.getZoom();
}

/* =====================================================================
   CHOP ETISH (Print layout) — faqat OSM rejimi uchun.
   Foydalanuvchi qog‘oz o‘lchami/yo‘nalishini tanlaydi, ramka xarita
   ustida ko‘rinadi, ramka ichida xaritani pan/zoom qilib joylashtiradi,
   legendani erkin joyga sudraydi. Masshtab va shimol belgisi tanlangan
   qog‘oz+zoom darajasiga qarab avtomatik hisoblanadi.
   ===================================================================== */
const PAPER_SIZES = {
  A4:[210,297], A3:[297,420], A2:[420,594], A1:[594,841], A0:[841,1189], Letter:[216,279]
};
let printOn = false;
function printDefaults(){
  if(!P.print) P.print = {paper:"A4", orientation:"portrait"};
  if(!P.legend.title) P.legend.title = true;
}
function paperPxWH(){
  const [w,h] = PAPER_SIZES[P.print.paper] || PAPER_SIZES.A4;
  return P.print.orientation === "landscape" ? [h,w] : [w,h];
}
function frameRect(){
  const stage = $("#stage").getBoundingClientRect();
  const [mw,mh] = paperPxWH();
  const pad = 56, barH = 64;
  const availW = stage.width - pad*2, availH = stage.height - pad*2 - barH;
  const s = Math.max(0.15, Math.min(availW/mw, availH/mh));
  const w = mw*s, h = mh*s;
  // x/y — brauzer oynasiga nisbatan (clientX/clientY, getBoundingClientRect bilan bir xil tizim).
  // CSS left/top yozishda stage.left/stage.top ayirib, stage-ichki koordinataga o'tkaziladi.
  const x = stage.left + (stage.width - w)/2, y = stage.top + barH + (availH - h)/2 + pad*0.3;
  return {x, y, w, h, s, mw, mh, stageLeft: stage.left, stageTop: stage.top};
}
function openPrint(){
  if(P.mode !== "osm"){ toast("Chop etish rejimi hozircha faqat OSM rejimida ishlaydi.", true); return; }
  printDefaults();
  printOn = true; invalidate();
  $("#printLayer").hidden = false;
  const sel = $("#ppPaper");
  sel.innerHTML = Object.entries(PAPER_SIZES).map(([k,d]) => `<option value="${k}">${k} (${d[0]}×${d[1]} mm)</option>`).join("");
  sel.value = P.print.paper;
  $("#ppOrient").textContent = P.print.orientation === "landscape" ? "Gorizontal" : "Vertikal";
  $$("#printLayer .pv-item").forEach(el => el.hidden = false);
  layoutPrint();
  toast("Ramka ichida xaritani surib/kattalashtirib joylashtiring, legendani sudrab ko‘chiring.");
}
function closePrint(){
  printOn = false; invalidate();
  $("#printLayer").hidden = true;
}
function fmtMM(v){ return v >= 1000 ? (v/1000).toFixed(v%1000?1:0)+" m" : Math.round(v)+" mm"; }
const SCALE_STEPS = [1,2,5,10,20,25,50,100,200,250,500,1000,2000,2500,5000,10000,20000,50000,100000,200000,500000];
function niceScaleLen(targetM){
  let best = SCALE_STEPS[0];
  for(const s of SCALE_STEPS) if(s <= targetM) best = s;
  return best;
}
// Elementning "tabiiy" (scale qo'llanmagan) o'lchami — offsetWidth/Height transformga bog'liq emas.
function itemNat(el){ return {w: el.offsetWidth || 1, h: el.offsetHeight || 1}; }
// Yuqori-chap burchakdan joylashtirish: element hech qachon ramkadan tashqariga chiqmaydi.
function placeTL(el, fr, frac, scale){
  const nat = itemNat(el), w = nat.w*scale, h = nat.h*scale;
  const availW = Math.max(0, fr.w - w), availH = Math.max(0, fr.h - h);
  const left = fr.x + availW*clamp(frac.xf,0,1), top = fr.y + availH*clamp(frac.yf,0,1);
  el.style.left = (left - fr.stageLeft)+"px"; el.style.top = (top - fr.stageTop)+"px";
  el.style.transform = `scale(${scale})`; el.style.transformOrigin = "top left";
  return {left, top, w, h, availW, availH};
}
// Markazdan joylashtirish (sarlavha uchun): translate(-50%,-50%) bilan birga.
function placeCenter(el, fr, frac, scale){
  const nat = itemNat(el), w = nat.w*scale, h = nat.h*scale;
  const availW = Math.max(0, fr.w - w), availH = Math.max(0, fr.h - h);
  const cx = fr.x + w/2 + availW*clamp(frac.xf,0,1), cy = fr.y + h/2 + availH*clamp(frac.yf,0,1);
  el.style.left = (cx - fr.stageLeft)+"px"; el.style.top = (cy - fr.stageTop)+"px";
  el.style.transform = `translate(-50%,-50%) scale(${scale})`;
  return {cx, cy, w, h, availW, availH};
}
function layoutPrint(){
  if(!printOn || !osmMap) return;
  const fr = frameRect();
  const frame = $("#printFrame");
  frame.style.left = (fr.x-fr.stageLeft)+"px"; frame.style.top = (fr.y-fr.stageTop)+"px"; frame.style.width = fr.w+"px"; frame.style.height = fr.h+"px";
  const [pmw, pmh] = PAPER_SIZES[P.print.paper] || PAPER_SIZES.A4;
  $("#ppInfo").textContent = `${P.print.paper} · ${P.print.orientation==="landscape"?"gorizontal":"vertikal"} · ${pmw}×${pmh} mm`;

  // Real yer masshtabi: ramkaning markaziy nuqtasidan 120 ekran-px chap/o'ngga mos haqiqiy masofa
  const c = osmMap.getContainer().getBoundingClientRect();
  const p1 = osmMap.containerPointToLatLng([fr.x - c.left + fr.w*0.5 - 60, fr.y - c.top + fr.h*0.5]);
  const p2 = osmMap.containerPointToLatLng([fr.x - c.left + fr.w*0.5 + 60, fr.y - c.top + fr.h*0.5]);
  const metersPer120px = osmMap.distance ? osmMap.distance(p1, p2) : 0;
  const mPerPx = metersPer120px / 120 || 0.001;
  const targetPx = clamp(P.legend.scaleTargetPx || Math.min(fr.w*0.32, 170), 40, Math.max(60, fr.w*0.9));
  const maxBarPx = Math.max(60, fr.w*0.9);
  let len = niceScaleLen(mPerPx * targetPx) || 100;
  let barPx = len / mPerPx;
  if(barPx > maxBarPx){
    // Bar kenglikni yolg'on ko'rsatmasligi uchun, torroq sig'adigan "chiroyli" qiymatga tushamiz.
    const idx = SCALE_STEPS.indexOf(len);
    let found = false;
    for(let i = idx; i >= 0; i--){
      if(SCALE_STEPS[i]/mPerPx <= maxBarPx){ len = SCALE_STEPS[i]; barPx = len/mPerPx; found = true; break; }
    }
    if(!found){ len = SCALE_STEPS[0]; barPx = Math.min(len/mPerPx, maxBarPx); }
  }
  barPx = Math.max(40, barPx);

  const sb = $("#printScaleBar");
  $(".pv-content", sb).innerHTML = `<div class="bar2" style="width:${barPx}px">${Array.from({length:4}).map(()=>"<i></i>").join("")}</div><div class="lbl"><span>0</span><span>${esc(len >= 1000 ? (len/1000)+" km" : len+" m")}</span></div>`;
  const sf = P.legend.scaleFree || {xf:.5, yf:.9};
  placeTL(sb, fr, sf, 1);

  const north = $("#printNorth");
  const ns = clamp(P.legend.northScale || 1, .5, 3);
  placeTL(north, fr, P.legend.northFree || {xf:.9, yf:.04}, ns);

  const legend = $("#printLegend");
  const items = legendItems();
  const ls = clamp(P.legend.freeScale || 1, .5, 3);
  if(items.length){
    legend.hidden = false;
    $(".pv-content", legend).innerHTML = `<b>FUNKSIONAL ZONALASH</b>` + items.map(z => `<div class="li"><span class="sw" style="background:${esc(z.color)}"></span>${esc(z.icon)} ${esc(z.name)}</div>`).join("");
    placeTL(legend, fr, P.legend.free || {xf:.03, yf:.06}, ls);
  }else legend.hidden = true;

  const title = $("#printTitle");
  const ts = clamp(P.legend.titleScale || 1, .5, 3);
  if(P.legend.title){
    title.hidden = false;
    $(".pv-content", title).innerHTML = `<b>${esc(P.name)}</b><span>Funksional zonalash xaritasi</span>`;
    placeCenter(title, fr, P.legend.titleFree || {xf:.5, yf:.06}, ts);
  }else title.hidden = true;
}
function addResizeHandle(el, key, opts){
  const h = $(".pv-resize", el); if(!h) return;
  const min = (opts && opts.min) || .5, max = (opts && opts.max) || 3, def = (opts && opts.def) || 1;
  h.addEventListener("pointerdown", e => {
    if(!printOn) return;
    e.stopPropagation();
    h.setPointerCapture(e.pointerId);
    const rect = el.getBoundingClientRect();
    const anchorCenter = el.id === "printTitle";
    const cx = anchorCenter ? rect.left + rect.width/2 : rect.left;
    const cy = anchorCenter ? rect.top + rect.height/2 : rect.top;
    const d0 = Math.max(20, Math.hypot(e.clientX - cx, e.clientY - cy));
    const s0 = P.legend[key] || def;
    const move = ev => {
      const d1 = Math.hypot(ev.clientX - cx, ev.clientY - cy);
      P.legend[key] = clamp(s0 * (d1/d0), min, max);
      layoutPrint();
    };
    const up = (ev) => { try{ h.releasePointerCapture(ev.pointerId); }catch(_){} h.removeEventListener("pointermove", move); h.removeEventListener("pointerup", up); commit(); };
    h.addEventListener("pointermove", move); h.addEventListener("pointerup", up);
  });
  h.addEventListener("dblclick", e => { e.stopPropagation(); P.legend[key] = def; layoutPrint(); commit(); });
}

function dragPvItem(el, key, anchor){
  el.addEventListener("pointerdown", e => {
    if(!printOn) return;

    const fr = frameRect();

    const scale = scaleKey ? clamp(P.legend[scaleKey] || 1, .5, 3) : 1;
    const nat = itemNat(el);
    const w = nat.w*scale, h = nat.h*scale;
    const availW = Math.max(0, fr.w - w), availH = Math.max(0, fr.h - h);
    const rect = el.getBoundingClientRect();
    const offX = e.clientX - rect.left, offY = e.clientY - rect.top;
    const move = ev => {
      let left = clamp(ev.clientX - offX, fr.x, fr.x + availW);
      let top = clamp(ev.clientY - offY, fr.y, fr.y + availH);
      const xf = availW > 0 ? (left - fr.x) / availW : 0.5;
      const yf = availH > 0 ? (top - fr.y) / availH : 0.5;
      P.legend[key] = {xf: clamp(xf,0,1), yf: clamp(yf,0,1)};

    const up = (ev) => { el.classList.remove("dragging"); try{ el.releasePointerCapture(ev.pointerId); }catch(_){} el.removeEventListener("pointermove", move); el.removeEventListener("pointerup", up); commit(); };
    el.addEventListener("pointermove", move); el.addEventListener("pointerup", up);
  });
}

/* ---------- PNG / PDF: ramka ichidagi ko‘rinishni canvasga tushirish ---------- */
/* Yuqori aniqlik: xaritaning ramka ichidagi qismi 2^d marta kattaroq zoom darajasidagi plitkalardan qayta yig'iladi */
function planHiRes(fr){
  if(!L_.base || !osmTiles || !osmMap) return null;
  const z = osmMap.getZoom(); if(!Number.isInteger(z)) return null;
  const zmax = Math.min(osmMap.getMaxZoom(), 19);
  for(let d=3; d>=1; d--){
    const zt = z + d; if(zt > zmax) continue;
    const M = 1 << d;
    if(fr.w*fr.h*M*M > 16e6 || Math.max(fr.w, fr.h)*M > 8192) continue;
    if(Math.ceil(fr.w*M/256 + 1) * Math.ceil(fr.h*M/256 + 1) > 120) continue;
    return {zt, M, c: osmMap.getContainer().getBoundingClientRect()};
  }
  return null;
}
async function drawHiResTiles(ctx, fr, hi){
  const {zt, M, c} = hi, bm = BASEMAPS[curBaseKey()] || BASEMAPS[DEF_BASE];
  const tl = osmMap.containerPointToLatLng([fr.x - c.left, fr.y - c.top]);
  const o = osmMap.project(tl, zt), n = Math.pow(2, zt);
  const x0 = Math.floor(o.x/256), x1 = Math.floor((o.x + fr.w*M - 1)/256);
  const y0 = Math.floor(o.y/256), y1 = Math.floor((o.y + fr.h*M - 1)/256);
  const jobs = [];
  for(let ty=y0; ty<=y1; ty++){ if(ty < 0 || ty >= n) continue; for(let tx=x0; tx<=x1; tx++) jobs.push({tx, ty}); }
  if(!jobs.length) return false;
  const subs = bm.opts && bm.opts.subdomains;
  const url = j => {
    const x = ((j.tx % n) + n) % n;
    return L.Util.template(bm.url, {s: subs ? subs[Math.abs(x + j.ty) % subs.length] : "", x, y:j.ty, z:zt, r:""});
  };
  const load = j => new Promise(res => {
    const im = new Image(); im.crossOrigin = "anonymous";
    const t = setTimeout(() => res(null), 15000);
    im.onload = () => { clearTimeout(t); res(im); };
    im.onerror = () => { clearTimeout(t); res(null); };
    im.src = url(j);
  });
  let ok = 0;
  for(let i=0; i<jobs.length; i+=8){
    const part = jobs.slice(i, i+8), ims = await Promise.all(part.map(load));
    ims.forEach((im, k) => {
      if(!im) return;
      ctx.drawImage(im, (part[k].tx*256 - o.x)/M, (part[k].ty*256 - o.y)/M, 257/M, 257/M); ok++;
    });
  }
  ctx.getImageData(0, 0, 1, 1);
  return ok === jobs.length;
}
async function exportOsmRaster(kind){
  const fr = frameRect();
  const hi = planHiRes(fr);
  const dpr = hi ? hi.M : clamp(window.devicePixelRatio || 1, 1, 2.5);
  const c = document.createElement("canvas");
  c.width = Math.round(fr.w*dpr); c.height = Math.round(fr.h*dpr);
  const ctx = c.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.fillStyle = "#eef1ee"; ctx.fillRect(0,0,fr.w,fr.h);

  let basemapOk = false;
  if(hi){
    try{ basemapOk = await drawHiResTiles(ctx, fr, hi); }catch(e){ basemapOk = false; }
    if(!basemapOk){ ctx.clearRect(0,0,fr.w,fr.h); ctx.fillStyle = "#eef1ee"; ctx.fillRect(0,0,fr.w,fr.h); }
  }
  if(!basemapOk) try{
    const mapRect = osmMap.getContainer().getBoundingClientRect();
    const tiles = osmMap.getContainer().querySelectorAll(".leaflet-tile-loaded");
    for(const img of tiles){
      const r = img.getBoundingClientRect();
      const x = r.left - fr.x, y = r.top - fr.y;
      if(x+r.width < 0 || y+r.height < 0 || x > fr.w || y > fr.h) continue;
      ctx.drawImage(img, x, y, r.width, r.height);
    }
    ctx.getImageData(0,0,1,1); // CORS tekshiruvi — tainted bo'lsa shu yerda xato beradi
    basemapOk = true;
  }catch(e){
    ctx.clearRect(0,0,fr.w,fr.h);
    ctx.fillStyle = "#eef1ee"; ctx.fillRect(0,0,fr.w,fr.h);
  }

  // Zonalar
  const zm = zoneMap(), mapC = osmMap.getContainer().getBoundingClientRect();
  const toXY = ll => { const pt = osmMap.latLngToContainerPoint(ll); return [pt.x + mapC.left - fr.x, pt.y + mapC.top - fr.y]; };
  for(const pl of P.polys){
    const z = zm[pl.zoneId]; if(!z || !z.visible) continue;
    ctx.beginPath();
    pl.pts.forEach((pt,i) => { const [x,y] = toXY(pt); i ? ctx.lineTo(x,y) : ctx.moveTo(x,y); });
    ctx.closePath();
    ctx.fillStyle = rgba(z.color, z.opacity); ctx.fill();
    ctx.lineWidth = 1.6; ctx.strokeStyle = rgba(z.color,.95); ctx.stroke();
    if(P.legend.labels){
      const [lx,ly] = labelPoint(pl.pts.map(toXY));
      drawLabelText(ctx, z.icon+" "+z.name, lx, ly, 1);
    }
  }
  ctx.strokeStyle = "rgba(20,30,32,.5)"; ctx.lineWidth = 2; ctx.strokeRect(1,1,fr.w-2,fr.h-2);

  // Legenda / sarlavha / masshtab / shimol — HUD elementlaridan joy va matnni olib chizamiz
  drawHtmlCard(ctx, $("#printTitle"), fr, clamp(P.legend.titleScale || 1, .5, 3));
  drawHtmlCard(ctx, $("#printLegend"), fr, clamp(P.legend.freeScale || 1, .5, 3));
  drawHtmlCard(ctx, $("#printScaleBar"), fr, 1);
  drawHtmlCard(ctx, $("#printNorth"), fr, clamp(P.legend.northScale || 1, .5, 3));
  if(basemapOk && L_.base) drawAttribution(ctx, fr);

  if(!basemapOk) toast("Bazaviy xarita eksportga qo‘shilmadi (provayder xavfsizlik siyosati). Faqat zonalar bilan saqlandi.", true);

  const safe = (P.name || "zonalash").replace(/[\\/:*?"<>|]+/g, "_").trim() || "zonalash";
  if(kind === "png"){
    const blob = await new Promise(r => c.toBlob(r, "image/png"));
    if(!blob) throw new Error("PNG yaratib bo‘lmadi.");
    await saveBlob(blob, safe+".png");
  }else{
    if(typeof window.jspdf === "undefined") throw new Error("PDF kutubxonasi yuklanmadi. Internetni tekshiring.");
    const { jsPDF } = window.jspdf;
    const [mw, mh] = paperPxWH();
    const pdf = new jsPDF({orientation:P.print.orientation, unit:"mm", format:[mw, mh]});
    pdf.addImage(c.toDataURL("image/png"), "PNG", 0, 0, mw, mh);
    pdf.save(safe+".pdf");
    toast("PDF tayyor.");
  }
}
function drawHtmlCard(ctx, el, fr, scale){
  if(!el || el.hidden) return;
  const sc = scale || 1;
  const R = n => { const r = n.getBoundingClientRect(); return {x:r.left-fr.x, y:r.top-fr.y, w:r.width, h:r.height}; };
  const F = (wt, px) => `${wt} ${px*sc}px "IBM Plex Sans",system-ui,sans-serif`;
  const card = R(el), content = el.querySelector(".pv-content");
  ctx.save();
  ctx.fillStyle = "rgba(255,255,255,.93)"; ctx.strokeStyle = "rgba(20,30,32,.45)"; ctx.lineWidth = 1;
  roundRect(ctx, card.x, card.y, card.w, card.h, 6*sc); ctx.fill(); ctx.stroke();
  ctx.textBaseline = "middle";
  if(el.id === "printScaleBar"){
    const bar = content.querySelector(".bar2"), b = R(bar), n = bar.children.length || 4;
    for(let i=0;i<n;i++){ ctx.fillStyle = i%2===0 ? "#1c272b" : "#ffffff"; ctx.fillRect(b.x + b.w/n*i, b.y, b.w/n, b.h); }
    ctx.strokeStyle = "#1c272b"; ctx.lineWidth = 1; ctx.strokeRect(b.x+.5, b.y+.5, b.w-1, b.h-1);
    const lb = content.querySelectorAll(".lbl span");
    ctx.fillStyle = "#1c272b"; ctx.font = F(400, 10);
    if(lb[0]){ const r = R(lb[0]); ctx.textAlign = "left"; ctx.fillText(lb[0].textContent, r.x, r.y + r.h/2); }
    if(lb[1]){ const r = R(lb[1]); ctx.textAlign = "right"; ctx.fillText(lb[1].textContent, r.x + r.w, r.y + r.h/2); }
  }else if(el.id === "printNorth"){
    const sp = R(content.querySelector("span")), t = R(content.querySelector("i"));
    ctx.fillStyle = "#1c272b"; ctx.textAlign = "center"; ctx.font = F(700, 12);
    ctx.fillText("N", sp.x + sp.w/2, sp.y + sp.h/2);
    ctx.beginPath(); ctx.moveTo(t.x + t.w/2, t.y); ctx.lineTo(t.x, t.y + t.h); ctx.lineTo(t.x + t.w, t.y + t.h); ctx.closePath(); ctx.fill();
  }else{
    const centered = el.id === "printTitle";
    for(const node of content.children){
      const r = R(node), tag = node.tagName;
      if(node.classList.contains("li")){
        const sw = node.querySelector(".sw"), s = R(sw);
        ctx.fillStyle = getComputedStyle(sw).backgroundColor; ctx.fillRect(s.x, s.y, s.w, s.h);
        ctx.strokeStyle = "rgba(0,0,0,.28)"; ctx.lineWidth = 1; ctx.strokeRect(s.x+.5, s.y+.5, s.w-1, s.h-1);
        ctx.fillStyle = "#1c272b"; ctx.textAlign = "left"; ctx.font = F(400, 12.5);
        ctx.fillText(node.textContent.trim(), s.x + s.w + 7*sc, r.y + r.h/2);
      }else if(tag === "B"){
        ctx.fillStyle = "#1c272b"; ctx.font = F(600, centered ? 15 : 11);
        ctx.textAlign = centered ? "center" : "left";
        ctx.fillText(node.textContent, centered ? r.x + r.w/2 : r.x, r.y + r.h/2);
      }else if(tag === "SPAN"){
        ctx.fillStyle = "#5b6b70"; ctx.font = F(400, 10.5);
        ctx.textAlign = centered ? "center" : "left";
        ctx.fillText(node.textContent, centered ? r.x + r.w/2 : r.x, r.y + r.h/2);
      }
    }
  }
  ctx.restore();
}
function drawAttribution(ctx, fr){
  const bm = BASEMAPS[curBaseKey()] || BASEMAPS[DEF_BASE];
  const txt = String(bm.attr).replace(/&copy;/g, "©").replace(/<[^>]+>/g, "").trim();
  ctx.save();
  let fs = 10; ctx.font = `400 ${fs}px "IBM Plex Sans",system-ui,sans-serif`;
  while(ctx.measureText(txt).width > fr.w - 16 && fs > 5){ fs -= .5; ctx.font = `400 ${fs}px "IBM Plex Sans",system-ui,sans-serif`; }
  const w = ctx.measureText(txt).width + 8, h = fs + 6;
  ctx.fillStyle = "rgba(255,255,255,.85)"; ctx.fillRect(fr.w - w - 3, fr.h - h - 3, w, h);
  ctx.fillStyle = "#1c272b"; ctx.textAlign = "right"; ctx.textBaseline = "middle";
  ctx.fillText(txt, fr.w - 7, fr.h - h/2 - 3);
  ctx.restore();
}

/* ---------- HTML (portativ, tahrirlanadigan) eksport ---------- */
async function exportPortableHtml(){
  if(!P || P.mode !== "osm") throw new Error("faqat OSM");
  const doc = document.documentElement.cloneNode(true);
  // Joriy ish holatini olib tashlab, ilovaning boshlang'ich holatiga qaytaramiz
  doc.querySelectorAll(".overlay, #fzm-embed").forEach(n => n.remove());
  const q = sel => doc.querySelector(sel);

/* =====================================================================
   Ko‘rinish: zoom / pan
   ===================================================================== */
function fitView(){
  if(P && P.mode === "osm"){
    if(!osmMap) return;
    const layers = osmMap._fzmZones ? osmMap._fzmZones.getLayers() : [];
    if(layers.length){ osmMap.fitBounds(L.featureGroup(layers).getBounds().pad(.15)); }
    return;
  }
  if(!P || W<=0 || H<=0) return;
  const pad = 24;
  const s = Math.max(0.001, Math.min((W-pad*2)/P.imgW, (H-pad*2)/P.imgH));
  V.s = s; V.tx = (W - P.imgW*s)/2; V.ty = (H - P.imgH*s)/2; V.fitted = true;
  invalidate();
}
function zoomAt(px, py, f){
  const minS = Math.min(0.02, (Math.min(W,H)/Math.max(P.imgW,P.imgH))*0.2), maxS = 64;
  const ns = clamp(V.s*f, minS, maxS); const r = ns/V.s;
  V.tx = px - (px - V.tx)*r; V.ty = py - (py - V.ty)*r; V.s = ns; V.fitted = false;
  invalidate();
}
const zoomCenter = f => zoomAt(W/2, H/2, f);

/* =====================================================================
   Kursor / pointer boshqaruvi
   ===================================================================== */
const ptrs = new Map(); let g = null; let lastVT = null;
const localPt = e => { const r = cv.getBoundingClientRect(); return {x:e.clientX - r.left, y:e.clientY - r.top}; };

function updateCursor(){
  const c = spaceDown ? "grab" : (tool === "select" ? "default" : "crosshair");
  cv.style.cursor = c;
  const el = $("#osmMap"); if(el) el.style.cursor = c;
}
function hitHandle(pl, sx, sy, type){
  const r = type === "mouse" ? 9 : 17; let best = null;
  pl.pts.forEach((pt,i)=>{ const [x,y]=toScr(pt[0],pt[1]); const d=Math.hypot(x-sx,y-sy); if(d<=r && (!best||d<best.d)) best={kind:"v",i,d}; });
  if(best) return best;
  const n = pl.pts.length;
  for(let i=0;i<n;i++){
    const a=pl.pts[i], b=pl.pts[(i+1)%n];
    const [ax,ay]=toScr(a[0],a[1]),[bx,by]=toScr(b[0],b[1]);
    if(Math.hypot(ax-bx,ay-by) < 28) continue;
    if(Math.hypot((ax+bx)/2-sx,(ay+by)/2-sy) <= r) return {kind:"mid", i, pt:[(a[0]+b[0])/2,(a[1]+b[1])/2]};
  }
  return null;
}
function polyAt(ix, iy){
  const zm = zoneMap();
  for(let i=P.polys.length-1;i>=0;i--){
    const p = P.polys[i], z = zm[p.zoneId];
    if(!z || !z.visible || !L_.zones) continue;
    if(pointInPoly(ix,iy,p.pts)) return p;
  }
  return null;
}

cv.addEventListener("contextmenu", e => e.preventDefault());
cv.addEventListener("pointerdown", e => {
  if(!P || !IMG) return;
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  const p = localPt(e);
  ptrs.set(e.pointerId, {x:p.x, y:p.y, type:e.pointerType});
  if(ptrs.size === 2){
    const a = Array.from(ptrs.values());
    g = {type:"pinch", d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y), mx:(a[0].x+a[1].x)/2, my:(a[0].y+a[1].y)/2};
    return;
  }
  if(ptrs.size > 2) return;
  if(e.button === 1 || (e.button === 0 && spaceDown)){ g = {type:"pan", lx:p.x, ly:p.y}; cv.style.cursor="grabbing"; return; }
  if(e.button === 2){
    if(tool === "select" && S.poly){
      const hit = hitHandle(getPoly(S.poly), p.x, p.y, "mouse");
      if(hit && hit.kind === "v"){ S.vertex = hit.i; deleteVertex(); }
    }
    return;
  }
  if(e.button !== 0 && e.pointerType === "mouse") return;
  if(tool === "select" && S.poly){
    const pl = getPoly(S.poly);
    const hit = pl && hitHandle(pl, p.x, p.y, e.pointerType);
    if(hit){
      if(hit.kind === "mid"){ pl.pts.splice(hit.i+1, 0, hit.pt); S.vertex = hit.i+1; g = {type:"vertex", changed:true, sx:p.x, sy:p.y, i:S.vertex}; }
      else { S.vertex = hit.i; g = {type:"vertex", changed:false, sx:p.x, sy:p.y, i:hit.i}; }
      renderRight(); invalidate(); return;
    }
  }
  g = {type:"tap", sx:p.x, sy:p.y, lx:p.x, ly:p.y, moved:false};
});

cv.addEventListener("pointermove", e => {
  if(!P || !IMG) return;
  const p = localPt(e);
  if(ptrs.has(e.pointerId)) ptrs.set(e.pointerId, {x:p.x, y:p.y, type:e.pointerType});
  const ip = toImg(p.x, p.y);
  $("#stCoord").textContent = `x: ${ip.x.toFixed(1)}  y: ${ip.y.toFixed(1)} px`;
  if(D && e.pointerType !== "touch" && !g){ D.hover = {x:clamp(ip.x,0,P.imgW), y:clamp(ip.y,0,P.imgH)}; invalidate(); }
  if(!g) return;
  if(g.type === "pinch"){
    if(ptrs.size < 2) return;
    const a = Array.from(ptrs.values());
    const d = Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y), mx=(a[0].x+a[1].x)/2, my=(a[0].y+a[1].y)/2;
    V.tx += mx - g.mx; V.ty += my - g.my;
    if(g.d > 0) zoomAt(mx, my, d/g.d);
    g.d = d; g.mx = mx; g.my = my; V.fitted = false; invalidate();
  }else if(g.type === "vertex"){
    if(!g.changed && Math.hypot(p.x-g.sx,p.y-g.sy) < 3) return;
    g.changed = true;
    const pl = getPoly(S.poly);
    if(pl){ pl.pts[S.vertex] = [clamp(ip.x,0,P.imgW), clamp(ip.y,0,P.imgH)]; }
    updateAreaUI(); invalidate();
  }else if(g.type === "pan"){
    V.tx += p.x - g.lx; V.ty += p.y - g.ly; g.lx = p.x; g.ly = p.y; V.fitted = false; invalidate();
  }else if(g.type === "tap"){
    if(!g.moved && Math.hypot(p.x-g.sx,p.y-g.sy) > (e.pointerType === "mouse" ? 4 : 9)) g.moved = true;
    if(g.moved){ V.tx += p.x - g.lx; V.ty += p.y - g.ly; V.fitted = false; invalidate(); }
    g.lx = p.x; g.ly = p.y;
  }
});

function endPointer(e, cancelled){
  const p = localPt(e);
  ptrs.delete(e.pointerId);
  if(!g) return;
  if(g.type === "pinch"){ if(ptrs.size < 2) g = null; return; }
  const gg = g; g = null;
  updateCursor();
  if(cancelled) return;
  if(gg.type === "vertex"){
    if(gg.changed){ commit(); updateAreaUI(); }
    else{
      const now = performance.now();
      if(lastVT && now - lastVT.t < 420 && lastVT.i === gg.i){ lastVT = null; S.vertex = gg.i; deleteVertex(); }
      else lastVT = {t:now, i:gg.i};
    }
  }else if(gg.type === "tap" && !gg.moved){
    handleTap(p, e.pointerType);
  }
}
cv.addEventListener("pointerup", e => endPointer(e, false));
cv.addEventListener("pointercancel", e => endPointer(e, true));
cv.addEventListener("pointerleave", e => { if(D && e.pointerType !== "touch"){ D.hover = null; invalidate(); } });
cv.addEventListener("wheel", e => {
  if(!P || !IMG) return;
  e.preventDefault();
  const p = localPt(e);
  zoomAt(p.x, p.y, Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0016)));
}, {passive:false});

function handleTap(p, ptype){
  const ip = toImg(p.x, p.y);
  if(tool === "select"){
    const hit = polyAt(ip.x, ip.y);
    if(hit){ S.poly = hit.id; S.vertex = -1; S.zone = hit.zoneId; }
    else { S.poly = null; S.vertex = -1; }
    renderLeft(); renderRight(); invalidate();
    return;
  }
  const x = clamp(ip.x, 0, P.imgW), y = clamp(ip.y, 0, P.imgH);
  if(tool === "draw"){
    if(!S.zone){ toast("Avval zonani tanlang yoki yangi zona yarating.", true); if(isMobile()) toggleSheet("left"); return; }
    if(!D) D = {pts:[], hover:null, last:null};
    const now = performance.now();
    if(D.pts.length >= 3){
      const [fx,fy] = toScr(D.pts[0][0], D.pts[0][1]);
      if(Math.hypot(fx-p.x, fy-p.y) < (ptype === "mouse" ? 12 : 20)){ finishDraw(); return; }
    }
    if(D.last && now - D.last.t < 350 && Math.hypot(D.last.x-p.x, D.last.y-p.y) < 12){
      if(D.pts.length >= 3) finishDraw(); else D.last = null;
      return;
    }
    D.last = {t:now, x:p.x, y:p.y};
    D.pts.push([x,y]);
    updateTopUI(); invalidate();
  }else if(tool === "scale"){
    if(SC.pts.length >= 2) SC.pts = [];
    SC.pts.push([x,y]);
    invalidate();
    if(SC.pts.length === 2) askScale();
    else toast("Ikkinchi nuqtani belgilang.");
  }
}

/* =====================================================================
   Amallar
   ===================================================================== */
function finishDraw(){
  if(!D || D.pts.length < 3){ toast("Zona yaratish uchun kamida 3 ta nuqta belgilang.", true); return; }
  if(!S.zone){ toast("Avval zonani tanlang.", true); return; }
  const pl = {id:uid("g"), zoneId:S.zone, pts:D.pts.map(p=>[p[0],p[1]]), ai:false, approved:true};
  P.polys.push(pl); D = null;
  commit(); refreshAll();
}
function cancelDraw(){
  D = null; SC.pts = []; updateTopUI(); invalidate();
}
function deletePoly(){
  if(!S.poly) return;
  P.polys = P.polys.filter(p => p.id !== S.poly);
  S.poly = null; S.vertex = -1; commit(); refreshAll();
}
function deleteVertex(){
  const pl = S.poly && getPoly(S.poly); if(!pl || S.vertex < 0) return;
  if(pl.pts.length <= 3){ toast("Poligonda kamida 3 ta nuqta bo‘lishi kerak. Butun poligonni o‘chirishingiz mumkin.", true); return; }
  pl.pts.splice(S.vertex, 1); S.vertex = -1; commit(); refreshAll();
}
function setActiveZone(id){
  S.zone = id;
  if(S.poly){ const pl = getPoly(S.poly); if(pl && pl.zoneId !== id){ S.poly = null; S.vertex = -1; } }
  renderLeft(); renderRight(); updateTopUI(); invalidate();
  if(isMobile() && tool === "draw") closeSheets();
}
function setTool(t){
  if(tool !== t){ D = null; SC.pts = []; }
  tool = t;
  if(t !== "select"){ S.vertex = -1; }
  if(osmMap){ if(t === "draw") osmMap.doubleClickZoom.disable(); else osmMap.doubleClickZoom.enable(); }
  updateCursor(); updateTopUI(); invalidate(); renderRight();
  if(t === "draw" && !S.zone) toast("Avval zonani tanlang yoki yangi zona yarating.", true);
}
function toggleZoneVisible(id){
  const z = P.zones.find(z => z.id === id); if(!z) return;
  z.visible = !z.visible; scheduleSave(); renderLeft(); invalidate();
}
function askDeleteZone(){
  const z = curZone(); if(!z) return;
  const n = P.polys.filter(p => p.zoneId === z.id).length;
  confirmBox(`“${z.name}” zonasi${n ? ` va uning ${n} ta poligoni` : ""} o‘chiriladi. Davom etasizmi?`, "O‘chirish", () => {
    P.zones = P.zones.filter(q => q.id !== z.id);
    P.polys = P.polys.filter(p => p.zoneId !== z.id);
    if(S.poly && !getPoly(S.poly)){ S.poly = null; S.vertex = -1; }
    S.zone = P.zones[0] ? P.zones[0].id : null;
    commit(); refreshAll();
  });
}

let modalEl = null;
function closeModal(){ if(modalEl){ modalEl.remove(); modalEl = null; } }
function openModal({title, html, actions = [], onMount, wide}){
  closeModal();
  const ov = document.createElement("div"); ov.className = "overlay";
  ov.innerHTML = `<div class="modal${wide?" wide":""}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2>${esc(title)}</h2><div class="mbody">${html}</div><div class="mact"></div></div>`;
  const act = $(".mact", ov);
  actions.forEach(a => {
    const b = document.createElement("button"); b.className = "btn " + (a.cls || ""); b.textContent = a.label;
    b.addEventListener("click", () => { const r = a.onClick ? a.onClick(ov) : null; if(r !== false && !a.keep) closeModal(); });
    act.appendChild(b);
  });
  ov.addEventListener("mousedown", e => { if(e.target === ov) closeModal(); });
  document.body.appendChild(ov); modalEl = ov;
  if(onMount) onMount(ov);
  const first = ov.querySelector("input:not([type=file]),select,textarea") || ov.querySelector("button");
  if(first) first.focus();
  return ov;
}

}

function loadImg(blob){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(blob), im = new Image();
    im.onload = () => res({im, url});
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error("img")); };
    im.src = url;
  });
}
async function createImageProject(name, file){
  const {im, url} = await loadImg(file);
  P = newProjectData(name, im.naturalWidth, im.naturalHeight);
  IMG = im; IMG_URL = url;
  try{ await dbPut("images", {id:P.id, blob:file}); await dbPut("projects", JSON.parse(JSON.stringify(P))); }
  catch(e){ toast("Diqqat: brauzer xotirasiga saqlab bo‘lmadi. Loyiha faqat shu sessiyada ishlaydi.", true); }
  startSession();
}
async function createOsmProject(name, lat, lng, zoom, base){
  P = newOsmProjectData(name, lat, lng, zoom);
  P.view.base = base || DEF_BASE;
  try{ await dbPut("projects", JSON.parse(JSON.stringify(P))); }
  catch(e){ toast("Diqqat: brauzer xotirasiga saqlab bo‘lmadi. Loyiha faqat shu sessiyada ishlaydi.", true); }
  startSession();
}
async function loadProject(id){
  const rec = await dbGet("projects", id);
  if(!rec) throw new Error("missing");
  if(rec.mode === "osm"){
    P = rec; IMG = null; IMG_URL = null;
  }else{
    const im = await dbGet("images", id);
    if(!im) throw new Error("missing");
    const {im:img, url} = await loadImg(im.blob);
    P = rec; IMG = img; IMG_URL = url;
  }
  P.zones.forEach(z => { if(z.visible === undefined) z.visible = true; });
  P.legend = Object.assign({pos:"tr", visible:true, labels:true}, P.legend || {});
  startSession();
}
function startSession(){
  S = {poly:null, vertex:-1, zone:P.zones[0] ? P.zones[0].id : null};
  D = null; SC.pts = []; tool = "select"; V.fitted = true;
  L_.base = L_.zones = L_.labels = true;
  LS.set("fzm-last", P.id);
  resetHistory();
  $("#home").hidden = true; $("#editor").hidden = false;
  $("#pname").value = P.name;
  $("#stSave").textContent = "Saqlandi ✓";

    $("#cv").hidden = true; $("#osmMap").hidden = false;

  }else{
    teardownOsm(); $("#osmMap").hidden = true; $("#cv").hidden = false;

  }

}

  LS.del("fzm-last");
